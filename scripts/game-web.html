<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>탕탕 특공대</title>
<style>
  html,body{margin:0;height:100%;background:#1f2a24;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;text-align:center}
  #ov.hide{display:none}
  h1{margin:0;font-size:32px;font-weight:900}
  p{margin:0;line-height:1.6;color:#e5e7eb;white-space:pre-line}
  .best{color:#fde047;font-weight:700}
  button{font:inherit;cursor:pointer}
  .btn{background:#16a34a;color:#fff;border:0;border-radius:14px;padding:14px 36px;font-size:18px;font-weight:800}
  .card{width:100%;max-width:380px;display:flex;align-items:center;gap:14px;background:#374151;border:2px solid #4b5563;border-radius:14px;padding:14px;color:#fff;text-align:left}
  .card:hover{border-color:#fde047}
  .card .e{font-size:30px}.card b{font-size:16px}.card i{color:#fde047;font-style:normal;font-size:12px;margin-left:4px}.card small{display:block;color:#d1d5db;margin-top:2px;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<script>
/*__ENGINE__*/
</script>
<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const BEST='tangtang:bestTime';
let W=0,H=0,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',resize);resize();
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
const getBest=()=>{try{return Number(localStorage.getItem(BEST))||0}catch(e){return 0}};
const setBest=t=>{try{localStorage.setItem(BEST,String(t))}catch(e){}};

let g=createGame(),phase='ready',choosing=false;
let stick=null,mv={x:0,y:0};const keys=new Set();
const EMO={grunt:'🧟',fast:'🦇',tank:'👹',boss:'💀'};

function show(html){ov.innerHTML=html;ov.classList.remove('hide');}
function hide(){ov.classList.add('hide');}
function menu(){
  const b=getBest();
  show('<h1>탕탕 특공대</h1><p>화면을 드래그(또는 WASD/방향키)로 이동하세요.\n총은 가장 가까운 적을 자동으로 조준합니다.\n레벨업 때마다 강화를 골라 최대한 오래 버티세요!</p>'+(b?'<div class="best">최고 기록 '+fmt(b)+'</div>':'')+'<button class="btn" id="go">게임 시작</button>');
  document.getElementById('go').onclick=start;
}
function start(){g=createGame();phase='playing';choosing=false;mv={x:0,y:0};stick=null;hide();}
function levelUp(){
  choosing=true;stick=null;mv={x:0,y:0};
  const cs=pickUpgrades(g);
  show('<h1>레벨 업! Lv.'+g.player.level+'</h1>'+cs.map((u,i)=>'<button class="card" data-i="'+i+'"><span class="e">'+u.emoji+'</span><span><b>'+u.name+'</b><i>Lv.'+(g.upgrades[u.id]+1)+'</i><small>'+u.desc+'</small></span></button>').join(''));
  ov.querySelectorAll('.card').forEach(el=>el.onclick=()=>{applyUpgrade(g,cs[+el.dataset.i].id);choosing=false;hide();});
}
function gameOver(){
  phase='over';const b=getBest();if(g.time>b)setBest(g.time);
  show('<h1>작전 실패</h1><p>생존 시간 '+fmt(g.time)+'\n처치 '+g.kills+' · 레벨 '+g.player.level+'</p><div class="best">최고 기록 '+fmt(Math.max(b,g.time))+'</div><button class="btn" id="go">다시 도전</button>');
  document.getElementById('go').onclick=start;
}

// 입력
const MAXS=48;
cv.addEventListener('pointerdown',e=>{if(phase!=='playing'||choosing)return;cv.setPointerCapture(e.pointerId);stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};});
cv.addEventListener('pointermove',e=>{if(!stick||e.pointerId!==stick.id)return;const dx=e.clientX-stick.ox,dy=e.clientY-stick.oy,l=Math.hypot(dx,dy)||1,c=Math.min(l,MAXS);stick.dx=dx/l*c;stick.dy=dy/l*c;mv={x:stick.dx/MAXS,y:stick.dy/MAXS};});
const endp=e=>{if(stick&&e.pointerId===stick.id){stick=null;mv={x:0,y:0};}};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const p=g.player;
  const cx=Math.min(Math.max(p.x-W/2,0),Math.max(0,WORLD-W)),cy=Math.min(Math.max(p.y-H/2,0),Math.max(0,WORLD-H));
  ctx.fillStyle='#1f2a24';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-cx,-cy);
  ctx.fillStyle='#2d3b32';ctx.fillRect(0,0,WORLD,WORLD);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<=WORLD;i+=100){ctx.moveTo(i,0);ctx.lineTo(i,WORLD);ctx.moveTo(0,i);ctx.lineTo(WORLD,i);}
  ctx.stroke();
  ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.strokeRect(0,0,WORLD,WORLD);
  ctx.fillStyle='#38bdf8';
  for(const m of g.gems){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(Math.PI/4);ctx.fillRect(-4,-4,8,8);ctx.restore();}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const e of g.enemies){
    ctx.globalAlpha=e.flash>0?.4:1;ctx.font=(e.r*1.7)+'px sans-serif';ctx.fillText(EMO[e.kind],e.x,e.y+1);
    if(e.kind==='boss'){ctx.globalAlpha=1;ctx.fillStyle='#111';ctx.fillRect(e.x-35,e.y-e.r-14,70,6);ctx.fillStyle='#ef4444';ctx.fillRect(e.x-35,e.y-e.r-14,70*Math.max(0,e.hp/e.maxHp),6);}
  }
  ctx.globalAlpha=1;ctx.fillStyle='#fde047';
  for(const b of g.bullets){ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();}
  if(g.stats.blades){ctx.font='24px sans-serif';for(const b of bladePositions(g))ctx.fillText('🌀',b.x,b.y);}
  ctx.globalAlpha=g.iframe>0&&Math.floor(g.time*20)%2?.4:1;
  ctx.fillStyle='#3b82f6';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.stroke();
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(g.angle);ctx.fillStyle='#e5e7eb';ctx.fillRect(6,-2.5,16,5);ctx.restore();
  ctx.globalAlpha=1;ctx.restore();

  if(stick&&phase==='playing'){
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(stick.ox,stick.oy,50,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(stick.ox+stick.dx,stick.oy+stick.dy,22,0,7);ctx.fill();
  }
  // HUD
  const bw=W-170;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(12,12,bw,16);ctx.fillRect(12,32,bw,6);
  ctx.fillStyle='#ef4444';ctx.fillRect(12,12,bw*p.hp/p.maxHp,16);
  ctx.fillStyle='#38bdf8';ctx.fillRect(12,32,bw*p.xp/p.xpNext,6);
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(Math.ceil(p.hp)+' / '+p.maxHp,12+bw/2,21);
  ctx.textAlign='right';ctx.font='800 18px sans-serif';ctx.fillText(fmt(g.time),W-12,22);
  ctx.fillStyle='#d1d5db';ctx.font='11px sans-serif';ctx.fillText('Lv.'+p.level+' · '+g.kills+'킬',W-12,40);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(phase==='playing'&&!choosing){
    let mx=mv.x,my=mv.y;
    if(keys.size){mx+=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);my+=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);}
    step(g,dt,mx,my);
    if(g.over)gameOver();else if(g.pendingLevel>0)levelUp();
  }
  draw();requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
