<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>탕탕 특공대 - 귀신 천마리</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden;font-family:"DungGeunMo","Galmuri11",ui-monospace,Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic",monospace;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  #ov{position:fixed;inset:0;background:rgba(6,8,20,.68);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;text-align:center}
  #ov.hide{display:none}
  .t1{font-size:15px;color:#9fb4ff;letter-spacing:4px}
  h1{margin:0;font-size:46px;font-weight:900;color:#ff3b3b;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;letter-spacing:2px}
  h2{margin:0;font-size:30px;color:#ffd84a;text-shadow:3px 3px 0 #000}
  p{margin:0;line-height:1.7;color:#d7ddf5;white-space:pre-line;font-size:15px}
  .best{color:#ffd84a;font-weight:700}
  button{font:inherit;cursor:pointer}
  .btn{background:#e8472c;color:#fff;border:4px solid #000;box-shadow:inset 0 -6px 0 #a02a14,inset 0 4px 0 #ff8a5b;padding:12px 38px;font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000}
  .btn:active{transform:translateY(2px)}
  .card{width:100%;max-width:400px;display:flex;align-items:center;gap:14px;background:#262a52;border:4px solid #000;box-shadow:inset 0 0 0 3px #4a52a3;padding:12px 14px;color:#fff;text-align:left}
  .card:hover,.card:focus{background:#343a72;box-shadow:inset 0 0 0 3px #ffd84a;outline:0}
  .card .e{font-size:32px}.card b{font-size:17px}.card i{color:#ffd84a;font-style:normal;font-size:12px;margin-left:6px}.card small{display:block;color:#c9d0f5;margin-top:3px;font-size:13px}
  @keyframes glow{0%,100%{text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 14px #ff3b3b}50%{text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 34px #ff9a3b}}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  h1{animation:glow 1.8s ease-in-out infinite,bob 2.4s ease-in-out infinite}
  .btn#go{animation:pop 1.1s ease-in-out infinite}
  .card{animation:pop .5s ease-out 1}
  #btns{position:fixed;right:10px;bottom:10px;display:flex;gap:8px;z-index:5}
  #btns button{width:44px;height:44px;font-size:20px;background:rgba(10,12,30,.7);color:#fff;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a52a3;padding:0}
  .tbl{border-collapse:collapse;font-size:14px;color:#e8ecff}.tbl th{color:#9fb4ff;padding:4px 10px;font-weight:400}.tbl td{padding:5px 10px;text-align:center;border-top:1px solid #343a72}.tbl tr.me td{color:#ffd84a;font-weight:700;background:rgba(255,216,74,.12)}
  .new{color:#ffd84a;font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000;animation:pop .8s ease-in-out infinite}
  #sp{position:fixed;left:calc(50% - 38px);bottom:12px;width:76px;height:76px;border-radius:50%;border:4px solid #000;color:#fff;z-index:5;display:none;padding:0;background:#3b4080;font:inherit;touch-action:manipulation}

  #sp .ch{position:absolute;top:-10px;right:-8px;background:#e8472c;border:3px solid #000;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:19px;text-align:center;font-weight:900}
  #sp.ready{animation:pop .6s ease-in-out infinite;box-shadow:0 0 24px #ffd84a;background:#ffd84a}
  #sp.ready .in{background:#7a3a10;color:#ffe9a0}
  #ov.solid{background:#05060f}

<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const BEST='tangtang:bestTime2';
/* 광고(트레일러) 모드: ad.html 로 빌드할 때 true. GAME_URL 을 채우면 마지막 버튼이 그 주소로 이동한다 */
const AD=/*__AD__*/false,GAME_URL='';
let W=0,H=0,dpr=1,Z=1,vig=null;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
/* 기록: 상위 10개 판(생존 시간 순) + 누적 최고치(처치·콤보)를 브라우저 localStorage 에 저장 */
let diff=2;try{const d=localStorage.getItem('tangtang:diff');if(d!==null&&DIFFICULTIES[+d])diff=+d;}catch(e){}
const DC=['#7ddc6a','#ffd84a','#ff7a3a','#ff3b3b'];
/* 전체 순위 서버: 빌드할 때 TANGTANG_API=https://... 로 주입 (game-server/README.md). 비어 있으면 내 기록만 쓴다 */
const API=/*__API__*/'';
/* Firebase(Firestore REST) 순위: 빌드할 때 TANGTANG_FB_KEY / TANGTANG_FB_PROJECT 로 주입 (game-server/README.md). 둘 다 있으면 API(Worker)보다 우선 */
const FB=/*__FB__*/null;
const BACKEND=FB?'fb':API?'api':'';
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>(x%36).toString(36)).join('');};
function ident(){let pid=lget('tangtang:pid'),sec=lget('tangtang:sec');if(!pid||!sec){pid=rid(24);sec=rid(32);lset('tangtang:pid',pid);lset('tangtang:sec',sec);}return{pid,sec};}
function getNick(){let n=lget('tangtang:nick');if(!n){n='도깨비'+(1000+((Math.random()*9000)|0));lset('tangtang:nick',n);}return n;}
function setNick(v){v=(v||'').replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim();v=Array.from(v).slice(0,12).join('');if(v)lset('tangtang:nick',v);return v;}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){const r=await fetch(API+path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||r.status),{status:r.status});return j;}
function submitScore(rec){
  if(!BACKEND||rec.t<10)return Promise.resolve(null);
  if(FB)return fbSubmit(rec);
  const id=ident();
  return api('/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({diff:rec.df,pid:id.pid,secret:id.sec,name:getNick(),t:Math.round(rec.t*10)/10,kills:rec.k,lvl:rec.l,combo:rec.c})});
}
const FSB=()=>FB.fs+'/projects/'+FB.project+'/databases/(default)/documents';
const fval=f=>f==null?undefined:f.integerValue!==undefined?Number(f.integerValue):f.doubleValue!==undefined?f.doubleValue:f.stringValue;
const fdec=f=>({name:fval(f.name),t:fval(f.t),kills:fval(f.kills),lvl:fval(f.lvl),combo:fval(f.combo)});
async function fbJson(url,init){const r=await fetch(url,init);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error('fb '+r.status),{status:r.status,body:j});return j;}
/** 익명 로그인(uid 가 곧 내 신원). 토큰은 localStorage 에 보관하고 만료 전에 갱신한다 */
async function fbAuth(){
  let a=null;try{a=JSON.parse(lget('tangtang:fbauth'))}catch(e){}
  if(a&&a.exp>Date.now()+60000)return a;
  let j=null;
  if(a&&a.refresh){try{j=await fbJson(FB.token+'?key='+FB.key,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.refresh)});a={uid:j.user_id,id:j.id_token,refresh:j.refresh_token,exp:Date.now()+Number(j.expires_in)*1000};}catch(e){j=null;}}
  if(!j){j=await fbJson(FB.signup+'?key='+FB.key,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({returnSecureToken:true})});a={uid:j.localId,id:j.idToken,refresh:j.refreshToken,exp:Date.now()+Number(j.expiresIn)*1000};}
  lset('tangtang:fbauth',JSON.stringify(a));return a;
}
const fbCount=async(coll,t)=>{
  const sq={from:[{collectionId:coll}]};if(t!==undefined)sq.where={fieldFilter:{field:{fieldPath:'t'},op:'GREATER_THAN',value:{doubleValue:t}}};
  const j=await fbJson(FSB()+':runAggregationQuery?key='+FB.key,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({structuredAggregationQuery:{aggregations:[{alias:'n',count:{}}],structuredQuery:sq}})});
  return Number(fval(j[0].result.aggregateFields.n));
};
async function fbBoard(d){
  const coll='scores_d'+d;let uid='';try{uid=JSON.parse(lget('tangtang:fbauth')).uid||''}catch(e){}
  const q=await fbJson(FSB()+':runQuery?key='+FB.key,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:coll}],orderBy:[{field:{fieldPath:'t'},direction:'DESCENDING'}],limit:50}})});
  const rows=q.filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),...fdec(x.document.fields)}));
  rows.sort((a,b)=>b.t-a.t||b.kills-a.kills);
  const out=rows.map((r,i)=>({rank:i+1,name:r.name,t:r.t,kills:r.kills,lvl:r.lvl,combo:r.combo,me:r.id===uid}));
  const total=await fbCount(coll);
  let mine=null;
  if(uid&&!out.some(r=>r.me)){
    const r=await fetch(FSB()+'/'+coll+'/'+uid+'?key='+FB.key);
    if(r.ok){const m=fdec((await r.json()).fields);mine={rank:(await fbCount(coll,m.t))+1,...m,me:true};}
  }
  return{diff:d,total,rows:out,mine};
}
async function fbSubmit(rec){
  const a=await fbAuth(),coll='scores_d'+rec.df,t=Math.round(rec.t*10)/10,nick=getNick();
  const cur=await fetch(FSB()+'/'+coll+'/'+a.uid+'?key='+FB.key);
  let old=null;if(cur.ok)old=fdec((await cur.json()).fields);else if(cur.status!==404)throw new Error('fb '+cur.status);
  const better=!old||t>old.t||(t===old.t&&rec.k>old.kills);
  let best=better?{t,kills:rec.k,lvl:rec.l,combo:rec.c}:old;
  if(better||old.name!==nick){
    await fbJson(FSB()+':commit?key='+FB.key,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+a.id},body:JSON.stringify({writes:[{
      update:{name:'projects/'+FB.project+'/databases/(default)/documents/'+coll+'/'+a.uid,fields:{name:{stringValue:nick},t:{doubleValue:best.t},kills:{integerValue:String(best.kills)},lvl:{integerValue:String(best.lvl)},combo:{integerValue:String(best.combo)}}},
      updateTransforms:[{fieldPath:'updated',setToServerValue:'REQUEST_TIME'}]}]})});
  }
  return{ok:true,rank:(await fbCount(coll,best.t))+1,total:await fbCount(coll),best,newBest:better};
}
const fetchBoard=d=>FB?fbBoard(d):api('/leaderboard?diff='+d+'&limit=50&pid='+encodeURIComponent(ident().pid));
const REC='tangtang:records2',BST='tangtang:bests';
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const getBest=()=>{const r=jget(REC,[]);let v=r.length?r[0].t:0;try{v=Math.max(v,Number(localStorage.getItem(BEST))||0)}catch(e){}return v;};
function addRecord(g){
  const rec={t:g.time,k:g.kills,l:g.player.level,c:g.bestCombo,coins:g.coins,d:Date.now(),df:g.diff};
  const prevBest=getBest(),bs=jget(BST,{k:0,c:0});
  const out={newTime:rec.t>prevBest,newKills:bs.k>0&&rec.k>bs.k,newCombo:bs.c>0&&rec.c>bs.c};
  const arr=jget(REC,[]);arr.push(rec);arr.sort((a,b)=>b.t-a.t||b.k-a.k);
  out.rank=arr.indexOf(rec);out.me=rec;
  jset(REC,arr.slice(0,10));jset(BST,{k:Math.max(bs.k,rec.k),c:Math.max(bs.c,rec.c)});
  return out;
}
const fdate=d=>{const x=new Date(d);return (x.getMonth()+1)+'/'+x.getDate();};
function recTable(hi){
  const r=jget(REC,[]);if(!r.length)return '<p>아직 기록이 없습니다.</p>';
  return '<table class="tbl"><tr><th>순위</th><th>생존</th><th>처치</th><th>Lv</th><th>콤보</th><th>난이도</th><th>날짜</th></tr>'+r.map((x,i)=>'<tr'+(hi&&x.d===hi.d&&x.t===hi.t?' class="me"':'')+'><td>'+(i===0?'🏆':i+1)+'</td><td>'+fmt(x.t)+'</td><td>'+x.k+'</td><td>'+x.l+'</td><td>'+x.c+'</td><td style="color:'+DC[x.df||0]+'">'+DIFFICULTIES[x.df||0].name+'</td><td>'+fdate(x.d)+'</td></tr>').join('')+'</table>';
}


/* ---------- 오디오: WebAudio 로 효과음·배경음악을 코드로 합성 ---------- */
const Au=(()=>{
  let ctx=null,master,bgmG,sfxG,noiseBuf,muted=false,bgmOn=false,nextT=0,step=0,intensity=0,chain=0,chainT=0;const lastT={};
  try{muted=localStorage.getItem('tangtang:mute')==='1'}catch(e){}
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const ok=(k,ms)=>{const n=performance.now();if(n-(lastT[k]||0)<ms)return false;lastT[k]=n;return true;};
  function init(){
    if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:.8;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    bgmG=ctx.createGain();bgmG.gain.value=.32;bgmG.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=.9;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function resume(){if(ctx&&ctx.state==='suspended')ctx.resume();}
  function tone(f,dur,type,vol,o){
    o=o||{};if(!ctx)return;const t=(o.at||ctx.currentTime)+(o.delay||0);
    const os=ctx.createOscillator(),g=ctx.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(o.atk||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    if(o.lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);fl.connect(g);}else os.connect(g);
    g.connect(o.dest||sfxG);os.start(t);os.stop(t+dur+.03);
  }
  function noise(dur,vol,o){
    o=o||{};if(!ctx)return;const t=(o.at||ctx.currentTime)+(o.delay||0);
    const src=ctx.createBufferSource();src.buffer=noiseBuf;
    const fl=ctx.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1500,t);fl.Q.value=o.q||1;
    if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(fl);fl.connect(g);g.connect(o.dest||sfxG);src.start(t,Math.random()*.5);src.stop(t+dur+.02);
  }
  function sfx(n){
    if(!ctx||muted)return;
    switch(n){
      case 'shoot':if(ok(n,70))tone(900+Math.random()*120,.07,'square',.035,{to:380});break;
      case 'hit':if(ok(n,45))noise(.05,.05,{f:2500,q:2});break;
      case 'kill':if(ok(n,35)){tone(260+Math.random()*60,.12,'triangle',.07,{to:90});noise(.08,.04,{f:900});}break;
      case 'gem':{const now=performance.now();chain=now-chainT<350?Math.min(chain+1,10):0;chainT=now;if(ok(n,30))tone(660*Math.pow(2,chain/6),.09,'sine',.05);break;}
      case 'coin':tone(1318,.07,'square',.04);tone(1760,.12,'square',.04,{delay:.07});break;
      case 'heal':[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.07,{delay:i*.07}));break;
      case 'hurt':tone(170,.2,'sawtooth',.12,{to:55,lp:900});noise(.12,.08,{f:300});break;
      case 'level':if(ok(n,700))[523,587,784,880,1175].forEach((f,i)=>tone(f,.18,'square',.05,{delay:i*.08,lp:3000}));tone(262,.6,'triangle',.08);break;
      case 'burst':noise(.55,.16,{type:'lowpass',f:1800,to:150});tone(140,.4,'sine',.18,{to:40});break;
      case 'thunder':if(ok(n,80)){noise(.22,.14,{type:'highpass',f:2500,to:6000});tone(90,.25,'sawtooth',.08,{to:40,lp:500});}break;
      case 'boss':tone(98,1.1,'sawtooth',.13,{to:73,lp:700});tone(103,1.1,'sawtooth',.1,{to:77,lp:700});noise(.8,.05,{type:'lowpass',f:400});break;
      case 'horde':for(let i=0;i<6;i++)tone(90+i*18,.18,'sine',.2,{to:50,delay:i*.12});break;
      case 'over':[392,370,330,262].forEach((f,i)=>tone(f,.4,'triangle',.1,{delay:i*.25}));break;
      case 'crit':if(ok(n,60)){tone(1568,.09,'triangle',.08,{to:2093});noise(.05,.06,{f:4000});}break;
      case 'bosskill':noise(1,.3,{type:'lowpass',f:3000,to:100});tone(110,.9,'sawtooth',.18,{to:30,lp:600});[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.4,'triangle',.07,{delay:.3+i*.06}));break;
      case 'combo':[659,784,988,1319,1568].forEach((f,i)=>tone(f,.1,'square',.05,{delay:i*.05,lp:3500}));break;
      case 'special':noise(1.2,.32,{type:'lowpass',f:4000,to:80});tone(60,1,'sine',.38,{to:30});tone(200,.6,'sawtooth',.1,{to:1600,lp:2500});[523,659,784,1047].forEach((f,i)=>tone(f,.5,'square',.05,{delay:.25+i*.04,lp:3000}));break;
      case 'ready':[988,1319].forEach((f,i)=>tone(f,.14,'triangle',.08,{delay:i*.09}));break;
      case 'deny':tone(150,.1,'square',.05,{to:110});break;
      case 'eshot':if(ok(n,120))tone(320,.12,'sawtooth',.04,{to:180,lp:1200});break;
      case 'click':tone(740,.05,'square',.04);break;
    }
  }
  /* 배경음악: D단조 5음계(궁·상·각·치·우 느낌) + 북소리 비트. 시간이 지날수록 악기가 늘어난다 */
  const sp=60/124/4,roots=[38,38,43,45],scale=[62,65,67,69,72,74,77];
  const lead=[[0,-1,-1,2,-1,3,-1,2,1,-1,0,-1,-1,-1,-1,-1],[0,-1,-1,1,-1,2,-1,3,4,-1,3,-1,2,-1,-1,-1],[2,-1,-1,3,-1,4,-1,5,4,-1,3,-1,2,-1,1,-1],[3,-1,2,-1,1,-1,0,-1,1,-1,2,-1,-1,-1,-1,-1]];
  function kick(t){tone(150,.16,'sine',.55,{at:t,to:45,dest:bgmG});}
  function snare(t){noise(.12,.28,{at:t,f:1800,q:.8,dest:bgmG});tone(190,.08,'triangle',.18,{at:t,dest:bgmG});}
  function hat(t,v){noise(.035,v,{at:t,type:'highpass',f:7000,dest:bgmG});}
  function sched(st,t){
    const bar=(st>>4)&3,s=st&15,root=roots[bar],L=intensity;
    if(s===0||s===8||(s===10&&L>0)||(L>1&&s===14&&bar%2))kick(t);
    if(s===4||s===12)snare(t);
    if(s%2===0)hat(t,s%4===2?.12:.07);else if(L>0&&Math.random()<.4)hat(t,.05);
    if(s===0||s===3||s===6||s===8||s===11||s===14)tone(mf(root+(s===6||s===14?12:0)),sp*1.8,'triangle',.24,{at:t,dest:bgmG,lp:500});
    if(L>=1){const d=lead[bar][s];if(d>=0){tone(mf(scale[d]),.3,'triangle',.17,{at:t,dest:bgmG,lp:2600});if(L>=2)tone(mf(scale[d]+12),.2,'sine',.05,{at:t,dest:bgmG});}}
    if(L>=2&&s%2===1)tone(mf(scale[(s>>1)%5]+(bar>1?12:0)),.1,'square',.022,{at:t,dest:bgmG,lp:3000});
    if(s===0&&bar===0)tone(mf(50),1.4,'sine',.1,{at:t,dest:bgmG});
  }
  setInterval(()=>{if(!ctx||!bgmOn||ctx.state!=='running')return;while(nextT<ctx.currentTime+.18){sched(step,nextT);nextT+=sp;step++;}},40);
  return{
    init,resume,sfx,
    play(){init();if(!ctx)return;resume();if(!bgmOn){bgmOn=true;nextT=ctx.currentTime+.05;}},
    stop(){bgmOn=false;},
    on:()=>bgmOn,
    setIntensity(v){intensity=v;},
    toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.8;try{localStorage.setItem('tangtang:mute',muted?'1':'0')}catch(e){}return muted;},
    muted:()=>muted,
  };
})();

function makeBG(){
  const c=document.createElement('canvas');c.width=c.height=WORLD;const x=c.getContext('2d');
  let s=20240;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  x.fillStyle='#46362b';x.fillRect(0,0,WORLD,WORLD);
  for(let j=0;j<WORLD;j+=16)for(let i=0;i<WORLD;i+=16){const r=R();if(r<.22){x.fillStyle='#3d2f26';x.fillRect(i,j,16,16);}else if(r<.32){x.fillStyle='#524033';x.fillRect(i,j,16,16);}}
  for(let n=0;n<260;n++){const gx=R()*WORLD,gy=R()*WORLD,rad=20+R()*50;
    for(let k=0;k<26;k++){const a=R()*6.28,d=R()*rad;x.fillStyle=R()<.5?'#2d4a3b':'#3a5a43';const q=4+((R()*3)|0)*2;x.fillRect((gx+Math.cos(a)*d)|0,(gy+Math.sin(a)*d)|0,q,q);}}
  for(let n=0;n<900;n++){x.fillStyle=R()<.5?'#6b5a4a':'#2e241d';x.fillRect((R()*WORLD)|0,(R()*WORLD)|0,3+((R()*3)|0),2);}
  const far=(px,py)=>Math.hypot(px-WORLD/2,py-WORLD/2)>240;
  // 한옥 지붕
  for(let n=0;n<16;n++){const bw=150+((R()*3)|0)*30,bh=90,bx=(R()*(WORLD-bw-40)+20)|0,by=(R()*(WORLD-bh-60)+20)|0;if(!far(bx+bw/2,by+bh/2))continue;
    x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx+8,by+bh,bw,14);
    x.fillStyle='#2a2236';x.fillRect(bx+10,by+bh-30,bw-20,40);
    x.fillStyle='#6b4a32';for(let q=bx+16;q<bx+bw-16;q+=24)x.fillRect(q,by+bh-30,5,40);
    x.fillStyle='#2f3f6e';x.fillRect(bx,by+10,bw,bh-34);
    x.fillStyle='#24325c';for(let q=by+16;q<by+bh-26;q+=8)x.fillRect(bx,q,bw,2);
    for(let q=bx+6;q<bx+bw;q+=12){x.fillStyle='#1d2a4f';x.fillRect(q,by+10,2,bh-34);}
    x.fillStyle='#3c4f8a';x.fillRect(bx+10,by,bw-20,12);x.fillStyle='#2a3a6c';x.fillRect(bx,by+10,10,6);x.fillRect(bx+bw-10,by+10,10,6);
    x.fillStyle='#3c4f8a';x.fillRect(bx-6,by+bh-26,14,6);x.fillRect(bx+bw-8,by+bh-26,14,6);}
  // 단풍나무
  for(let n=0;n<26;n++){const tx=(R()*(WORLD-80)+40)|0,ty=(R()*(WORLD-100)+60)|0;if(!far(tx,ty))continue;
    x.fillStyle='rgba(0,0,0,.3)';x.fillRect(tx-20,ty+10,44,10);
    x.fillStyle='#4a2f1f';x.fillRect(tx-4,ty-8,8,22);
    const cols=['#c4511d','#e0702a','#f09a3a','#a63d15'];
    for(let k=0;k<22;k++){x.fillStyle=cols[(R()*4)|0];const a=R()*6.28,d=R()*26;x.fillRect((tx+Math.cos(a)*d-6)|0,(ty-26+Math.sin(a)*d*.8-6)|0,12,12);}}
  // 등불
  for(let n=0;n<34;n++){const lx=(R()*(WORLD-40)+20)|0,ly=(R()*(WORLD-40)+20)|0;if(!far(lx,ly))continue;
    const g=x.createRadialGradient(lx,ly,2,lx,ly,46);g.addColorStop(0,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=g;x.fillRect(lx-46,ly-46,92,92);
    x.fillStyle='#4a2f1f';x.fillRect(lx-1,ly,3,16);x.fillStyle='#d9372b';x.fillRect(lx-5,ly-9,10,11);x.fillStyle='#ffd27a';x.fillRect(lx-3,ly-6,6,5);}
  x.fillStyle='rgba(12,16,48,.28)';x.fillRect(0,0,WORLD,WORLD);
  return c;
}

  const hw=34;ctx.fillStyle='#000';ctx.fillRect(p.x-hw/2-1,p.y+22,hw+2,7);ctx.fillStyle='#5a1414';ctx.fillRect(p.x-hw/2,p.y+23,hw,5);ctx.fillStyle='#46d14a';ctx.fillRect(p.x-hw/2,p.y+23,hw*p.hp/p.maxHp,5);

  // 참격(총알)
  for(const b of g.bullets){if(!vis(b.x,b.y,20))continue;const a=Math.atan2(b.vy,b.vx);ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(90,180,255,.22)';ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';if(Math.random()<.35)P(b.x,b.y,0,0,.22,'rgba(140,210,255,.8)',3,0);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
    ctx.fillStyle='rgba(80,180,255,.45)';ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(0,-6);ctx.lineTo(10,0);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#bfe6ff';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(0,-3.5);ctx.lineTo(9,0);ctx.lineTo(0,3.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-4,-1,10,2);ctx.restore();}

  // 적 불화살
  ctx.globalCompositeOperation='lighter';
  for(const sh of g.shots){if(!vis(sh.x,sh.y,12))continue;ctx.fillStyle='rgba(255,90,40,.3)';ctx.beginPath();ctx.arc(sh.x,sh.y,12,0,7);ctx.fill();if(Math.random()<.5)P(sh.x,sh.y,0,0,.25,'rgba(255,140,60,.8)',3,0);}
  ctx.globalCompositeOperation='source-over';
  for(const sh of g.shots){if(!vis(sh.x,sh.y,12))continue;ctx.fillStyle='#ff4a2a';ctx.beginPath();ctx.arc(sh.x,sh.y,6,0,7);ctx.fill();ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(sh.x,sh.y,2.5,0,7);ctx.fill();}
  // 필살기 빛
  if(specialT>0){const k=1-specialT/.6,rr=80+700*k,gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);gr.addColorStop(0,'rgba(255,240,170,'+.6*(1-k)+')');gr.addColorStop(.7,'rgba(255,180,70,'+.25*(1-k)+')');gr.addColorStop(1,'rgba(255,160,60,0)');
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(p.x-rr,p.y-rr,rr*2,rr*2);ctx.globalCompositeOperation='source-over';}
  // 충격파 링
  ctx.globalCompositeOperation='lighter';
  for(const r of rings){const k=1-r.t/r.life,rad=r.max*(1-(1-k)*(1-k));ctx.globalAlpha=(1-k)*.9;ctx.strokeStyle='rgb('+r.c+')';ctx.lineWidth=r.w*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,7);ctx.stroke();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // 번개
  for(const th of g.thunders){const k=th.life/.3;ctx.globalAlpha=k;
    ctx.fillStyle='rgba(150,210,255,.45)';ctx.beginPath();ctx.arc(th.x,th.y,46*(1.2-k*.4),0,7);ctx.fill();
    const pts=[[th.x+Math.sin(th.x)*10,th.y-vh/2-40]];for(let i=1;i<8;i++)pts.push([th.x+Math.sin(th.x*.7+i*12.9+(th.life*40|0))*16,th.y-(vh/2+40)*(1-i/8)]);pts.push([th.x,th.y]);
    for(const [w,c] of [[9,'rgba(90,170,255,.6)'],[3,'#fff']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();}
    ctx.globalAlpha=1;}
  // 파티클
  for(const q of parts){if(!vis(q.x,q.y,10))continue;ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
  ctx.globalAlpha=1;
  // 데미지 숫자 (0 일반 / 1 불꽃 / 2 번개 / 3 치명타)
  const FC=['#fff','#ff9a3a','#8fd0ff','#ffe14a'];
  for(const f of g.floaters){ctx.globalAlpha=Math.min(1,f.life*3);{const kk=.6-f.life,pop=1+Math.max(0,.15-kk)*(f.kind===3?9:4);outline('-'+f.text+(f.kind===3?'!':''),f.x,f.y,(f.kind===3?19:f.kind?15:13)*pop,FC[f.kind]||'#fff','center');}}
  ctx.globalAlpha=1;

  /* ----- 화면 좌표 ----- */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(g.hurt>0){ctx.fillStyle='rgba(220,30,30,'+(g.hurt/.2*.25)+')';ctx.fillRect(0,0,W,H);}
  if(phase==='playing'&&p.hp/p.maxHp<.3){const a=.1+.08*Math.sin(T*8);const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);gr.addColorStop(0,'rgba(200,0,0,0)');gr.addColorStop(1,'rgba(200,0,0,'+(a*3)+')');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  if(flash>0){ctx.fillStyle='rgba(255,240,180,'+flash*.35+')';ctx.fillRect(0,0,W,H);}

  if(stick&&phase==='playing'){
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(stick.ox,stick.oy,50,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(stick.ox+stick.dx,stick.oy+stick.dy,22,0,7);ctx.fill();
  }

  // HUD: 상단 경험치 바 + LV
  const hs=Math.max(1,Math.min(1.6,W/520)),bh=18*hs;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,bh+4);ctx.fillStyle='#161a3a';ctx.fillRect(3,3,W-6,bh-2);
  const xw=(W-6)*Math.min(1,p.xp/p.xpNext);
  ctx.fillStyle='#2f6fe0';ctx.fillRect(3,3,xw,bh-2);ctx.fillStyle='#6fb2ff';ctx.fillRect(3,3,xw,(bh-2)/3);
  if(xw>8){const x0=3+((T*160)%xw),w=Math.min(26,3+xw-x0);ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(x0,3,w,bh-2);}
  outline('LV '+p.level,10,bh/2+2,13*hs,'#fff');
  // 스킬 아이콘
  const icons=[{t:'b',l:g.stats.bullets}];if(g.stats.blades)icons.push({t:'c',l:g.stats.blades});if(g.upgrades.fire)icons.push({t:'f',l:g.upgrades.fire});if(g.upgrades.thunder)icons.push({t:'t',l:g.upgrades.thunder});
  icons.forEach((ic,i)=>{const ix=8+i*(34*hs),iy=bh+10,sz=30*hs;
    ctx.fillStyle='#000';ctx.fillRect(ix-2,iy-2,sz+4,sz+4);ctx.fillStyle='#2a2f5e';ctx.fillRect(ix,iy,sz,sz);
    if(ic.t==='c')club(ix+sz/2,iy+sz/2,-.7,.55*hs);
    else if(ic.t==='f'||ic.t==='t'){ctx.font=(18*hs)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ic.t==='f'?'🔥':'⚡',ix+sz/2,iy+sz/2+1);}
    else{ctx.save();ctx.translate(ix+sz/2,iy+sz/2);ctx.rotate(-.6);ctx.fillStyle='#8fd0ff';ctx.fillRect(-9*hs,-2*hs,18*hs,4*hs);ctx.fillStyle='#fff';ctx.fillRect(-3*hs,-1*hs,10*hs,2*hs);ctx.restore();}
    outline(String(ic.l),ix+sz-2,iy+sz-4,11*hs,'#ffd84a','right');});
  // 타이머 / 엽전 / 처치
  outline(fmt(g.time),W/2,bh+22*hs,26*hs,'#fff','center');
  if(phase==='playing')outline(DIFFICULTIES[g.diff].name,W/2,bh+46*hs,12*hs,DC[g.diff],'center');
  outline('●',W-96*hs,bh+20*hs,14*hs,'#ffc933','center');outline(String(g.coins),W-84*hs,bh+20*hs,16*hs,'#ffe38a','left');
  outline('☠',W-96*hs,bh+44*hs,14*hs,'#e6e6e6','center');outline(String(g.kills),W-84*hs,bh+44*hs,16*hs,'#fff','left');
  if(toast){const k=Math.min(1,toast.t/.4),pop=1+Math.max(0,toast.t-(toast===null?0:toast.t))*0;ctx.globalAlpha=k;outline(toast.text,W/2,H*.27,Math.min(34,W/14)*Math.max(1,hs*.8),toast.c,'center');ctx.globalAlpha=1;}
  // 콤보
  if(g.combo>=5){
    if(g.combo!==lastCombo){popT=.15;lastCombo=g.combo;}
    const pop=1+popT*3,cxp=W-14*hs,cyp=H*.4;
    ctx.save();ctx.translate(cxp,cyp);ctx.scale(pop,pop);
    const cc=g.combo>=100?'hsl('+((T*240)%360|0)+',100%,62%)':g.combo>=50?'#ff7ad9':g.combo>=25?'#fff07a':'#ffb02e';
    if(g.combo>=50)ctx.translate((Math.random()-.5)*3,(Math.random()-.5)*3);
    outline('x'+g.combo,0,0,34*hs,cc,'right');outline('COMBO!',0,28*hs,18*hs,'#ff4a3a','right');ctx.restore();
  }else lastCombo=0;
  if(popT>0)popT-=1/60;
  if(AD&&(phase==='ad'||phase==='adwait'))adDraw();
}


/* ---------- 광고(트레일러): 실제 게임 엔진을 연출대로 돌린다 (약 30초) ---------- */
function cap(text,dur,c,y,size){caps.push({text,t0:adT,dur:dur||2,c:c||'#fff',y:y||.78,size:size||1});}
function up(id,n){for(let i=0;i<n;i++)applyUpgrade(g,id);}
const AD_TL=[
  [0.3,()=>cap('고요한 밤…',2.2,'#cfd8ff',.5)],
  [2.6,()=>cap('그런데…',1.0,'#ff9a9a',.5)],
  [3.0,()=>{Au.play();Au.setIntensity(0);g.hordeAt=g.time;}],
  [3.6,()=>{adTitle=adT;flash=1;shake=.6;zk=.3;Au.sfx('boss');ring(g.player.x,g.player.y,420,.8,'255,60,60',10);Au.setIntensity(1);}],
  [6.8,()=>{cap('도깨비가 나선다!',2.2,'#8fd0ff');up('multi',1);up('blade',2);Au.setIntensity(2);}],
  [9.0,()=>{cap('쏘고 · 베고 · 태우고!',2.2,'#ffb02e');up('fire',3);up('pierce',1);up('damage',1);}],
  [11.4,()=>{cap('번개까지 내리친다  ⚡',2,'#bfe6ff');up('thunder',3);up('damage',2);zk=.2;}],
  [13.6,()=>{cap('끝없이 터지는 콤보!',2,'#ff7ad9');up('rate',2);up('blade',2);up('multi',1);}],
  [15.8,()=>{cap('새로운 괴물들이 몰려온다!',1.6,'#ffd84a');g.time=70;g.bossesSpawned=1;g.spawnT=0;Au.setIntensity(3);}],
  [17.6,()=>{cap('🐯 호랑이   🥚 달걀귀신   💀 해골 궁수',2.4,'#fff',.8,.8);}],
  [20.0,()=>{cap('⚠ 저승사자 출현!',2.2,'#ff4a3a');g.time=60.1;g.bossesSpawned=0;zk=.25;}],
  [23.0,()=>{cap('필살기 충전 완료!',1.3,'#8fd0ff');g.charges=1;Au.sfx('ready');}],
  [24.3,()=>{cap('SPACE · 도깨비 대폭발!!',2.0,'#ffd84a',.5,1.15);useSpecial(g);}],
  [26.6,()=>showCTA()],
];
let sd=12345;const REAL_RAND=Math.random;
function adWait(){
  phase='adwait';syncBtns();ov.classList.add('solid');
  show('<div class="t1">탕탕 특공대</div><h1>귀신 천마리</h1><button class="btn" id="go">▶ 광고 재생</button><p>소리를 켜고 보세요 🔊</p>');
  document.getElementById('go').onclick=startAd;
}
function startAd(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  Au.init();Au.resume();Au.stop();
  sd=12345;Math.random=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;}; // 매번 같은 연출
  g=createGame();parts.length=0;rings.length=0;caps.length=0;toast=null;flash=0;shake=0;hitStop=0;slow=0;punch=0;
  adT=0;adI=0;adAcc=0;zk=0;adTitle=-9;ZM=1.3;phase='ad';hide();syncBtns();
}
function showCTA(){
  Au.setIntensity(2);
  show('<div class="t1">탕탕 특공대</div><h1>귀신 천마리</h1><p>도깨비가 되어 천 마리 귀신을 막아내라!\n무료 · 설치 없이 바로 플레이</p><button class="btn" id="go">지금 플레이 ▶</button><button class="small" id="rp">↻ 광고 다시 보기</button>');
  document.getElementById('go').onclick=()=>{if(GAME_URL){location.href=GAME_URL;return;}Math.random=REAL_RAND;start();};
  document.getElementById('rp').onclick=startAd;
}
function adStep(dt){
  adT+=dt;
  while(adI<AD_TL.length&&AD_TL[adI][0]<=adT){AD_TL[adI][1]();adI++;}
  let sdt=dt;if(hitStop>0){hitStop-=dt;sdt=0;}else if(slow>0){slow-=dt;sdt=dt*.3;}
  if(sdt>0)step(g,sdt,Math.cos(adT*.9),Math.sin(adT*.7));
  g.player.hp=g.player.maxHp;g.pendingLevel=0;toast=null; // 광고에서는 무적, 레벨업 창 없음
  handleEvents(adT>.2);updateParts(dt);
  if(g.hurt>.15)shake=Math.max(shake,.2);else shake=Math.max(0,shake-dt);
  zk*=Math.pow(.05,dt);ZM=1+zk+Math.max(0,(4-adT)/4)*.3;
}
function dimA(){
  if(adT<2.4)return .8-.35*adT/2.4;
  if(adT<3.6)return .45;
  if(adT<4.3)return .45*(1-(adT-3.6)/.7);
  if(adT>25.8)return Math.min(.6,(adT-25.8)*.8);
  return 0;
}
function adDraw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const da=phase==='adwait'?1:dimA();
  if(da>0){ctx.fillStyle='rgba(2,3,12,'+da+')';ctx.fillRect(0,0,W,H);}
  if(phase!=='ad')return;
  // 타이틀 슬램
  const a=adT-3.6;
  if(a>=0&&a<3.3){
    const out=Math.min(1,(3.3-a)/.5),sc=a<.18?3-(a/.18)*2:1+.02*Math.sin(a*5),u=Math.min(W,H*1.6);
    ctx.save();ctx.translate(W/2,H*.42);ctx.globalAlpha=Math.min(1,a/.08)*out;
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.rotate(adT*.4);
    for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.fillStyle='rgba(255,90,60,.12)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,-40);ctx.lineTo(W,40);ctx.fill();}
    ctx.restore();
    ctx.scale(sc,sc);
    outline('탕탕 특공대',0,-u/9,u/20,'#9fb4ff','center');
    outline('귀신 천마리',0,0,u/6.5,'#ff3b3b','center');
    outline('도깨비 vs 귀신 1,000마리',0,u/10,u/24,'#fff','center');
    ctx.restore();
  }
  for(const c of caps){
    const age=adT-c.t0;if(age<0||age>c.dur)continue;
    const k=Math.min(1,age/.22),o=Math.min(1,(c.dur-age)/.3);
    ctx.save();ctx.globalAlpha=Math.min(k,o);ctx.translate(W/2,H*c.y);const sc=1+(1-k)*.6;ctx.scale(sc,sc);
    outline(c.text,0,0,Math.min(54,W/13)*c.size,c.c,'center');ctx.restore();
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(phase==='ready'){
    // 타이틀 배경 데모: 도깨비가 자동으로 싸운다 (소리 없음)
    g.player.hp=g.player.maxHp;const a=now/1500;step(g,dt,Math.cos(a),Math.sin(a*.8));
    while(g.pendingLevel>0)applyUpgrade(g,pickUpgrades(g)[0].id);
    handleEvents(false);updateParts(dt);if(g.time>100)g=createGame();
  }else if(phase==='playing'&&!choosing&&!paused){
    let mx=mv.x,my=mv.y;
    if(keys.size){mx+=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);my+=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);}
    let sdt=dt;if(hitStop>0){hitStop-=dt;sdt=0;}else if(slow>0){slow-=dt;sdt=dt*.3;}
    if(sdt>0)step(g,sdt,mx,my);
    const MS=[10,25,50,100,150,200,300,500];
    while(milestone<MS.length&&g.combo>=MS[milestone]){toast={text:MS[milestone]+' COMBO!',c:'#ffb02e',t:1.4};Au.sfx('combo');ring(g.player.x,g.player.y,170,.6,'255,200,80',6);flash=Math.max(flash,.25);punch=Math.max(punch,.05);milestone++;}
    if(g.combo===0)milestone=0;
    if((dustT-=dt)<=0&&Math.hypot(mx,my)>.1){dustT=.09;P(g.player.x+(Math.random()-.5)*8,g.player.y+16,(Math.random()-.5)*20,-10,.35,'#7a6552',3,0);}
    handleEvents(true);updateParts(dt);
    if(g.hurt>.15)shake=Math.max(shake,.2);else shake=Math.max(0,shake-dt);
    Au.setIntensity(Math.min(3,1+Math.floor(g.time/40)+(g.enemies.some(e=>e.kind==='boss')?1:0)));
    if(g.over)gameOver();else if(g.pendingLevel>0)levelUp();
  }else if(phase==='ad'){
    adAcc+=Math.min(dt,.1);while(adAcc>=1/60){adAcc-=1/60;adStep(1/60);}
  }else if(phase==='over'){updateParts(dt);shake=Math.max(0,shake-dt);}
  updSpecialUI();draw();requestAnimationFrame(loop);
}
if(AD)adWait();else menu();requestAnimationFrame(loop);
window.__game=()=>g;
})();
</script>
