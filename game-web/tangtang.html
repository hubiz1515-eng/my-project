<script>
// 탕탕 특공대 스타일 서바이버 슈터의 순수 게임 로직 (React 에 의존하지 않음)
const WORLD = 2400;
const UPGRADES = [
    { id: 'damage', name: '공격력 강화', desc: '총알 피해 +25%', emoji: '💥', max: 8 },
    { id: 'rate', name: '연사 속도', desc: '발사 간격 -15%', emoji: '⚡', max: 8 },
    { id: 'multi', name: '다중 사격', desc: '한 번에 발사하는 총알 +1', emoji: '🔫', max: 5 },
    { id: 'pierce', name: '관통탄', desc: '총알이 적 1명 더 관통', emoji: '🎯', max: 4 },
    { id: 'range', name: '사거리 증가', desc: '조준 사거리 +20%', emoji: '🔭', max: 4 },
    { id: 'speed', name: '이동 속도', desc: '이동 속도 +12%', emoji: '👟', max: 5 },
    { id: 'hp', name: '최대 체력', desc: '최대 체력 +25, 체력 회복', emoji: '❤️', max: 8 },
    { id: 'regen', name: '체력 재생', desc: '초당 체력 +1 회복', emoji: '🩹', max: 5 },
    { id: 'magnet', name: '자석', desc: '경험치 획득 범위 +50%', emoji: '🧲', max: 5 },
    { id: 'blade', name: '도깨비 방망이', desc: '몸 주위를 도는 방망이 +1', emoji: '🏏', max: 6 },
    { id: 'fire', name: '도깨비불', desc: '주기적으로 주변에 불꽃을 터뜨림', emoji: '🔥', max: 6 },
];
function createGame() {
    return {
        time: 0,
        kills: 0,
        over: false,
        pendingLevel: 0,
        nextId: 1,
        spawnT: 0.5,
        bossesSpawned: 0,
        fireT: 0,
        angle: -Math.PI / 2,
        orbitAngle: 0,
        iframe: 0,
        view: { w: 400, h: 400 },
        coins: 0,
        combo: 0,
        comboT: 0,
        bestCombo: 0,
        burstT: 2,
        hordeAt: 75,
        hurt: 0,
        player: { x: WORLD / 2, y: WORLD / 2, hp: 100, maxHp: 100, level: 1, xp: 0, xpNext: 5, r: 14 },
        stats: { damage: 10, fireInterval: 0.45, bullets: 1, pierce: 1, range: 320, speed: 150, magnet: 70, regen: 0.4, blades: 0 },
        upgrades: { damage: 0, rate: 0, multi: 0, pierce: 0, speed: 0, hp: 0, magnet: 0, regen: 0, blade: 0, range: 0, fire: 0 },
        enemies: [],
        bullets: [],
        gems: [],
        pickups: [],
        floaters: [],
        bursts: [],
    };
}
const BULLET_SPEED = 520;
const MAX_ENEMIES = 260;
const BLADE_RADIUS = 72;
const BLADE_HIT_R = 16;
function bladePositions(g) {
    const n = g.stats.blades;
    const out = [];
    for (let i = 0; i < n; i++) {
        const a = g.orbitAngle + (i * Math.PI * 2) / n;
        out.push({ x: g.player.x + Math.cos(a) * BLADE_RADIUS, y: g.player.y + Math.sin(a) * BLADE_RADIUS });
    }
    return out;
}
function pickUpgrades(g, count = 3) {
    const pool = UPGRADES.filter((u) => g.upgrades[u.id] < u.max);
    const out = [];
    while (out.length < count && pool.length) {
        out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return out;
}
function applyUpgrade(g, id) {
    g.upgrades[id]++;
    const s = g.stats;
    switch (id) {
        case 'damage':
            s.damage *= 1.25;
            break;
        case 'rate':
            s.fireInterval *= 0.85;
            break;
        case 'multi':
            s.bullets += 1;
            break;
        case 'pierce':
            s.pierce += 1;
            break;
        case 'range':
            s.range *= 1.2;
            break;
        case 'speed':
            s.speed *= 1.12;
            break;
        case 'hp':
            g.player.maxHp += 25;
            g.player.hp = Math.min(g.player.maxHp, g.player.hp + 40);
            break;
        case 'regen':
            s.regen += 1;
            break;
        case 'magnet':
            s.magnet *= 1.5;
            break;
        case 'blade':
            s.blades += 1;
            break;
        case 'fire': break;
    }
    g.pendingLevel = Math.max(0, g.pendingLevel - 1);
}
function spawnEnemy(g, kind, angle) {
    const minutes = g.time / 60;
    const scale = 1 + minutes * 0.35;
    const a = angle ?? Math.random() * Math.PI * 2;
    const d = Math.hypot(g.view.w, g.view.h) / 2 + 30;
    const x = Math.min(WORLD - 20, Math.max(20, g.player.x + Math.cos(a) * d));
    const y = Math.min(WORLD - 20, Math.max(20, g.player.y + Math.sin(a) * d));
    let e;
    switch (kind) {
        case 'fast':
            e = { kind, hp: 12 * scale, r: 11, speed: 115, dmg: 4, xp: 1 };
            break;
        case 'tank':
            e = { kind, hp: 70 * scale, r: 18, speed: 48, dmg: 9, xp: 4 };
            break;
        case 'boss':
            e = { kind, hp: 500 * (1 + g.bossesSpawned * 0.8) * (1 + minutes * 0.2), r: 36, speed: 58, dmg: 20, xp: 40 };
            break;
        default: e = { kind: 'grunt', hp: 22 * scale, r: 13, speed: 70, dmg: 5, xp: 1 };
    }
    g.enemies.push({ ...e, id: g.nextId++, x, y, maxHp: e.hp, flash: 0, orbitCd: 0 });
}
function damageEnemy(g, e, dmg, kind = 0) {
    e.hp -= dmg;
    e.flash = 0.08;
    if (g.floaters.length < 50) {
        g.floaters.push({ x: e.x + (Math.random() - 0.5) * 14, y: e.y - e.r, text: Math.round(dmg), life: 0.6, kind });
    }
    if (e.hp <= 0 && e.xp > 0) {
        const boss = e.kind === 'boss';
        g.kills++;
        g.combo++;
        g.comboT = 2.2;
        g.bestCombo = Math.max(g.bestCombo, g.combo);
        g.gems.push({ id: g.nextId++, x: e.x, y: e.y, v: e.xp });
        const coins = boss ? 8 : Math.random() < 0.22 ? 1 : 0;
        for (let i = 0; i < coins; i++) {
            g.pickups.push({ id: g.nextId++, x: e.x + (Math.random() - 0.5) * 30, y: e.y + (Math.random() - 0.5) * 30, type: 'coin' });
        }
        if (boss || Math.random() < 0.012)
            g.pickups.push({ id: g.nextId++, x: e.x, y: e.y, type: 'heal' });
        e.xp = 0; // 중복 처리 방지 (hp<=0 로 이후 제거)
    }
}
function step(g, dt, mx, my) {
    if (g.over)
        return;
    const p = g.player;
    const s = g.stats;
    g.time += dt;
    // 이동
    const ml = Math.hypot(mx, my);
    if (ml > 0.05) {
        const k = Math.min(1, ml) / ml;
        p.x = Math.min(WORLD - p.r, Math.max(p.r, p.x + mx * k * s.speed * dt));
        p.y = Math.min(WORLD - p.r, Math.max(p.r, p.y + my * k * s.speed * dt));
    }
    if (s.regen > 0)
        p.hp = Math.min(p.maxHp, p.hp + s.regen * dt);
    g.iframe = Math.max(0, g.iframe - dt);
    g.orbitAngle += dt * 3;
    g.hurt = Math.max(0, g.hurt - dt);
    if (g.combo > 0 && (g.comboT -= dt) <= 0)
        g.combo = 0;
    for (const f of g.floaters) {
        f.y -= 32 * dt;
        f.life -= dt;
    }
    g.floaters = g.floaters.filter((f) => f.life > 0);
    for (const b of g.bursts)
        b.life -= dt;
    g.bursts = g.bursts.filter((b) => b.life > 0);
    // 도깨비불: 주기적으로 주변에 폭발
    const fl = g.upgrades.fire;
    if (fl > 0 && (g.burstT -= dt) <= 0) {
        g.burstT = Math.max(1.2, 4.2 - 0.45 * fl);
        const R = 90 + 16 * fl;
        g.bursts.push({ x: p.x, y: p.y, r: R, life: 0.45, maxLife: 0.45 });
        for (const e of g.enemies) {
            if (e.hp > 0 && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (R + e.r) ** 2)
                damageEnemy(g, e, s.damage * (1.5 + 0.4 * fl), 1);
        }
    }
    // 적 스폰
    g.spawnT -= dt;
    if (g.spawnT <= 0) {
        const t = g.time;
        g.spawnT = Math.max(0.08, 0.7 - t * 0.006);
        const batch = 1 + Math.floor(t / 25);
        for (let i = 0; i < batch && g.enemies.length < MAX_ENEMIES; i++) {
            const r = Math.random();
            let kind = 'grunt';
            if (t > 15 && r < 0.2)
                kind = 'fast';
            else if (t > 35 && r < 0.33)
                kind = 'tank';
            spawnEnemy(g, kind);
        }
    }
    // 귀신 떼: 일정 간격으로 플레이어를 둘러싸는 포위 웨이브
    if (g.time >= g.hordeAt) {
        g.hordeAt += 75;
        for (let i = 0; i < 40 && g.enemies.length < MAX_ENEMIES; i++)
            spawnEnemy(g, 'grunt', (i / 40) * Math.PI * 2);
    }
    if (g.time >= (g.bossesSpawned + 1) * 60) {
        spawnEnemy(g, 'boss');
        g.bossesSpawned++;
    }
    // 자동 조준 + 발사
    let target = null;
    let best = s.range * s.range;
    for (const e of g.enemies) {
        if (e.hp <= 0)
            continue;
        const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
        if (d < best) {
            best = d;
            target = e;
        }
    }
    if (target)
        g.angle = Math.atan2(target.y - p.y, target.x - p.x);
    g.fireT -= dt;
    if (target && g.fireT <= 0) {
        g.fireT = s.fireInterval;
        const n = s.bullets;
        for (let i = 0; i < n; i++) {
            const a = g.angle + (i - (n - 1) / 2) * 0.16;
            g.bullets.push({ id: g.nextId++, x: p.x, y: p.y, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, dmg: s.damage, life: s.range / BULLET_SPEED + 0.25, pierce: s.pierce, hit: new Set() });
        }
    }
    // 총알
    for (const b of g.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        for (const e of g.enemies) {
            if (e.hp <= 0 || b.hit.has(e.id))
                continue;
            const rr = e.r + 4;
            if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr) {
                b.hit.add(e.id);
                damageEnemy(g, e, b.dmg);
                if (b.pierce-- <= 0) {
                    b.life = 0;
                    break;
                }
            }
        }
    }
    g.bullets = g.bullets.filter((b) => b.life > 0 && b.x > 0 && b.y > 0 && b.x < WORLD && b.y < WORLD);
    // 회전 칼날
    const blades = s.blades ? bladePositions(g) : [];
    // 적 이동 / 접촉
    for (const e of g.enemies) {
        e.flash = Math.max(0, e.flash - dt);
        e.orbitCd = Math.max(0, e.orbitCd - dt);
        if (e.hp <= 0)
            continue;
        const dx = p.x - e.x;
        const dy = p.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const wob = Math.sin(g.time * 3 + e.id) * 0.35;
        e.x += ((dx - dy * wob) / d) * e.speed * dt;
        e.y += ((dy + dx * wob) / d) * e.speed * dt;
        if (e.orbitCd <= 0) {
            for (const bl of blades) {
                const rr = e.r + BLADE_HIT_R;
                if ((e.x - bl.x) ** 2 + (e.y - bl.y) ** 2 < rr * rr) {
                    damageEnemy(g, e, s.damage * 0.8);
                    e.orbitCd = 0.4;
                    break;
                }
            }
        }
        if (e.hp > 0 && g.iframe <= 0 && d < e.r + p.r) {
            p.hp -= e.dmg;
            g.iframe = 0.6;
            g.hurt = 0.2;
        }
    }
    g.enemies = g.enemies.filter((e) => e.hp > 0);
    // 경험치 젬
    for (const gem of g.gems) {
        const dx = p.x - gem.x;
        const dy = p.y - gem.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < s.magnet) {
            gem.x += (dx / d) * 420 * dt;
            gem.y += (dy / d) * 420 * dt;
        }
        if (d < p.r + 6) {
            p.xp += gem.v;
            gem.v = 0;
        }
    }
    g.gems = g.gems.filter((gem) => gem.v > 0);
    for (const k of g.pickups) {
        const dx = p.x - k.x;
        const dy = p.y - k.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < s.magnet) {
            k.x += (dx / d) * 420 * dt;
            k.y += (dy / d) * 420 * dt;
        }
        if (d < p.r + 8) {
            if (k.type === 'coin')
                g.coins++;
            else
                p.hp = Math.min(p.maxHp, p.hp + 25);
            k.id = -1;
        }
    }
    g.pickups = g.pickups.filter((k) => k.id >= 0);
    while (p.xp >= p.xpNext) {
        p.xp -= p.xpNext;
        p.level++;
        p.xpNext = Math.round(p.xpNext * 1.22 + 2);
        g.pendingLevel++;
    }
    if (p.hp <= 0) {
        p.hp = 0;
        g.over = true;
    }
}

</script>

/* ---------- 밤의 마을 배경 (한 번만 미리 그림) ---------- */
function makeBG(){
  const c=document.createElement('canvas');c.width=c.height=WORLD;const x=c.getContext('2d');
  let s=20240;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  x.fillStyle='#46362b';x.fillRect(0,0,WORLD,WORLD);
  for(let j=0;j<WORLD;j+=16)for(let i=0;i<WORLD;i+=16){const r=R();if(r<.22){x.fillStyle='#3d2f26';x.fillRect(i,j,16,16);}else if(r<.32){x.fillStyle='#524033';x.fillRect(i,j,16,16);}}
  for(let n=0;n<260;n++){const gx=R()*WORLD,gy=R()*WORLD,rad=20+R()*50;
    for(let k=0;k<26;k++){const a=R()*6.28,d=R()*rad;x.fillStyle=R()<.5?'#2d4a3b':'#3a5a43';const q=4+((R()*3)|0)*2;x.fillRect((gx+Math.cos(a)*d)|0,(gy+Math.sin(a)*d)|0,q,q);}}
  for(let n=0;n<900;n++){x.fillStyle=R()<.5?'#6b5a4a':'#2e241d';x.fillRect((R()*WORLD)|0,(R()*WORLD)|0,3+((R()*3)|0),2);}
  const far=(px,py)=>Math.hypot(px-WORLD/2,py-WORLD/2)>240;
  // 한옥 지붕
  for(let n=0;n<16;n++){const bw=150+((R()*3)|0)*30,bh=90,bx=(R()*(WORLD-bw-40)+20)|0,by=(R()*(WORLD-bh-60)+20)|0;if(!far(bx+bw/2,by+bh/2))continue;
    x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx+8,by+bh,bw,14);
    x.fillStyle='#2a2236';x.fillRect(bx+10,by+bh-30,bw-20,40);
    x.fillStyle='#6b4a32';for(let q=bx+16;q<bx+bw-16;q+=24)x.fillRect(q,by+bh-30,5,40);
    x.fillStyle='#2f3f6e';x.fillRect(bx,by+10,bw,bh-34);
    x.fillStyle='#24325c';for(let q=by+16;q<by+bh-26;q+=8)x.fillRect(bx,q,bw,2);
    for(let q=bx+6;q<bx+bw;q+=12){x.fillStyle='#1d2a4f';x.fillRect(q,by+10,2,bh-34);}
    x.fillStyle='#3c4f8a';x.fillRect(bx+10,by,bw-20,12);x.fillStyle='#2a3a6c';x.fillRect(bx,by+10,10,6);x.fillRect(bx+bw-10,by+10,10,6);
    x.fillStyle='#3c4f8a';x.fillRect(bx-6,by+bh-26,14,6);x.fillRect(bx+bw-8,by+bh-26,14,6);}
  // 단풍나무
  for(let n=0;n<26;n++){const tx=(R()*(WORLD-80)+40)|0,ty=(R()*(WORLD-100)+60)|0;if(!far(tx,ty))continue;
    x.fillStyle='rgba(0,0,0,.3)';x.fillRect(tx-20,ty+10,44,10);
    x.fillStyle='#4a2f1f';x.fillRect(tx-4,ty-8,8,22);
    const cols=['#c4511d','#e0702a','#f09a3a','#a63d15'];
    for(let k=0;k<22;k++){x.fillStyle=cols[(R()*4)|0];const a=R()*6.28,d=R()*26;x.fillRect((tx+Math.cos(a)*d-6)|0,(ty-26+Math.sin(a)*d*.8-6)|0,12,12);}}
  // 등불
  for(let n=0;n<34;n++){const lx=(R()*(WORLD-40)+20)|0,ly=(R()*(WORLD-40)+20)|0;if(!far(lx,ly))continue;
    const g=x.createRadialGradient(lx,ly,2,lx,ly,46);g.addColorStop(0,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=g;x.fillRect(lx-46,ly-46,92,92);
    x.fillStyle='#4a2f1f';x.fillRect(lx-1,ly,3,16);x.fillStyle='#d9372b';x.fillRect(lx-5,ly-9,10,11);x.fillStyle='#ffd27a';x.fillRect(lx-3,ly-6,6,5);}
  x.fillStyle='rgba(12,16,48,.28)';x.fillRect(0,0,WORLD,WORLD);
  return c;
}
const BG=makeBG();

/* ---------- 상태 / UI ---------- */
let g=createGame(),phase='ready',choosing=false,face=1,shake=0,popT=0,lastCombo=0;
let stick=null,mv={x:0,y:0};const keys=new Set();
function show(html){ov.innerHTML=html;ov.classList.remove('hide');}
function hide(){ov.classList.add('hide');}
function menu(){
  const b=getBest();
  show('<div class="t1">탕탕 특공대</div><h1>귀신 천마리</h1><p>도깨비가 되어 몰려오는 귀신·강시·구미호를 막아내세요!\n\n화면 드래그 / WASD · 방향키 = 이동\n공격은 가장 가까운 적을 자동 조준합니다.\n레벨업마다 강화를 골라 최대한 오래 버티세요.</p>'+(b?'<div class="best">최고 기록 '+fmt(b)+'</div>':'')+'<button class="btn" id="go">게임 시작</button>');
  document.getElementById('go').onclick=start;
}
function start(){g=createGame();phase='playing';choosing=false;mv={x:0,y:0};stick=null;lastCombo=0;hide();}
function levelUp(){
  choosing=true;stick=null;mv={x:0,y:0};
  const cs=pickUpgrades(g);
  show('<h2>LEVEL UP!  Lv.'+g.player.level+'</h2>'+cs.map((u,i)=>'<button class="card" data-i="'+i+'"><span class="e">'+u.emoji+'</span><span><b>'+u.name+'</b><i>Lv.'+(g.upgrades[u.id]+1)+'</i><small>'+u.desc+'</small></span></button>').join(''));
  ov.querySelectorAll('.card').forEach(el=>el.onclick=()=>{applyUpgrade(g,cs[+el.dataset.i].id);choosing=false;hide();});
}
function gameOver(){
  phase='over';const b=getBest();if(g.time>b)setBest(g.time);
  show('<h2>GAME OVER</h2><p>생존 시간  '+fmt(g.time)+'\n처치  '+g.kills+'   최대 콤보  '+g.bestCombo+'\n레벨  '+g.player.level+'   엽전  '+g.coins+'</p><div class="best">최고 기록 '+fmt(Math.max(b,g.time))+'</div><button class="btn" id="go">다시 도전</button>');
  document.getElementById('go').onclick=start;
}

/* ---------- 입력 ---------- */
const MAXS=48;
cv.addEventListener('pointerdown',e=>{if(phase!=='playing'||choosing)return;cv.setPointerCapture(e.pointerId);stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};});
cv.addEventListener('pointermove',e=>{if(!stick||e.pointerId!==stick.id)return;const dx=e.clientX-stick.ox,dy=e.clientY-stick.oy,l=Math.hypot(dx,dy)||1,c=Math.min(l,MAXS);stick.dx=dx/l*c;stick.dy=dy/l*c;mv={x:stick.dx/MAXS,y:stick.dy/MAXS};});
const endp=e=>{if(stick&&e.pointerId===stick.id){stick=null;mv={x:0,y:0};}};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());

function resize(){
  dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  Z=Math.max(1,Math.min(W,H)/400);
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);
  vig.addColorStop(0,'rgba(5,6,20,0)');vig.addColorStop(1,'rgba(5,6,20,.7)');
}
addEventListener('resize',resize);resize();

/* ---------- 그리기 ---------- */
function outline(str,x,y,size,fill,align){
  ctx.font='900 '+size+'px '+getComputedStyle(document.body).fontFamily;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/5);ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.strokeText(str,x,y);ctx.fillStyle=fill;ctx.fillText(str,x,y);
}
function drawSpr(img,x,y,size,flip){
  if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(img,-size/2,-size/2,size,size);ctx.restore();}
  else ctx.drawImage(img,x-size/2,y-size/2,size,size);
}
function club(x,y,ang,sc){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(sc,sc);
  ctx.fillStyle='#000';ctx.fillRect(-19,-4,16,8);ctx.fillRect(-5,-8,24,16);
  ctx.fillStyle='#b9822a';ctx.fillRect(-17,-2,14,4);ctx.fillStyle='#ffd84a';ctx.fillRect(-3,-6,20,12);
  ctx.fillStyle='#fff3a6';ctx.fillRect(-3,-6,20,3);ctx.fillStyle='#b9822a';ctx.fillRect(3,-1,3,3);ctx.fillRect(10,-1,3,3);ctx.fillRect(1,3,3,3);
  ctx.restore();
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  const p=g.player,vw=W/Z,vh=H/Z;g.view.w=vw;g.view.h=vh;
  const cx=Math.min(Math.max(p.x-vw/2,0),Math.max(0,WORLD-vw)),cy=Math.min(Math.max(p.y-vh/2,0),Math.max(0,WORLD-vh));
  const sh=shake>0?(Math.random()-.5)*6*shake/.2:0,sv=shake>0?(Math.random()-.5)*6*shake/.2:0;
  ctx.fillStyle='#0b0d1a';ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*Z,0,0,dpr*Z,(-cx*Z+sh)*dpr,(-cy*Z+sv)*dpr);
  ctx.drawImage(BG,0,0);
  ctx.strokeStyle='#e8472c';ctx.lineWidth=6;ctx.strokeRect(0,0,WORLD,WORLD);
  const vis=(x,y,m)=>x>cx-m&&x<cx+vw+m&&y>cy-m&&y<cy+vh+m;
  const T=g.time;

  // 경험치 / 엽전 / 떡
  for(const m of g.gems){if(!vis(m.x,m.y,10))continue;const b=Math.sin(T*6+m.id)*1.5;
    ctx.fillStyle='#000';ctx.fillRect(m.x-5,m.y-8+b,10,14);ctx.fillStyle='#2f8cff';ctx.fillRect(m.x-4,m.y-7+b,8,12);ctx.fillStyle='#8fd0ff';ctx.fillRect(m.x-2,m.y-6+b,3,6);}
  for(const k of g.pickups){if(!vis(k.x,k.y,12))continue;
    if(k.type==='coin'){ctx.fillStyle='#000';ctx.fillRect(k.x-6,k.y-6,12,12);ctx.fillStyle='#ffc933';ctx.fillRect(k.x-5,k.y-5,10,10);ctx.fillStyle='#8a5a0a';ctx.fillRect(k.x-2,k.y-2,4,4);ctx.fillStyle='#fff3a6';ctx.fillRect(k.x-4,k.y-4,3,2);}
    else{ctx.fillStyle='#000';ctx.fillRect(k.x-11,k.y-4,22,12);ctx.fillStyle='#f3efe6';ctx.fillRect(k.x-10,k.y+3,20,3);ctx.fillStyle='#ff9ab8';ctx.fillRect(k.x-9,k.y-3,6,6);ctx.fillStyle='#fff';ctx.fillRect(k.x-3,k.y-3,6,6);ctx.fillStyle='#7ccf6a';ctx.fillRect(k.x+3,k.y-3,6,6);}}

  // 도깨비불 폭발
  for(const b of g.bursts){const k=1-b.life/b.maxLife,r=b.r*(1-(1-k)*(1-k));
    ctx.globalAlpha=(1-k)*.45;ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();
    ctx.globalAlpha=1-k;ctx.strokeStyle='#ffe066';ctx.lineWidth=5;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.stroke();
    for(let i=0;i<18;i++){const a=i/18*6.283+k*2;ctx.fillStyle=i%2?'#ff5a1a':'#ffd23a';const q=8-6*k;ctx.fillRect(b.x+Math.cos(a)*r-q/2,b.y+Math.sin(a)*r-q/2,q,q);}
    ctx.globalAlpha=1;}

  // 적 (아래쪽부터 그려 겹침 자연스럽게)
  const en=g.enemies.filter(e=>vis(e.x,e.y,50)).sort((a,b)=>a.y-b.y);
  for(const e of en){
    const sz=SIZE[e.kind],bob=Math.sin(T*10+e.id)*1.6;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(e.x,e.y+sz*.4,sz*.32,sz*.1,0,0,7);ctx.fill();
    const key=SPR[e.kind]+(e.flash>0?'F':'');
    drawSpr(S[key],e.x,e.y+bob-(e.kind==='boss'?4:0),sz,p.x<e.x);
    if(e.kind==='boss'){const w=80;ctx.fillStyle='#000';ctx.fillRect(e.x-w/2-1,e.y-sz/2-14,w+2,8);ctx.fillStyle='#d62828';ctx.fillRect(e.x-w/2,e.y-sz/2-13,w*Math.max(0,e.hp/e.maxHp),6);}
  }

  // 방망이 링
  const nb=g.stats.blades;
  if(nb){
    ctx.fillStyle='rgba(255,200,80,.10)';ctx.beginPath();ctx.arc(p.x,p.y,72,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,226,140,.65)';ctx.lineWidth=7;ctx.setLineDash([10,7]);ctx.beginPath();ctx.arc(p.x,p.y,72,0,7);ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<nb;i++){const a=g.orbitAngle+i*6.2832/nb;club(p.x+Math.cos(a)*72,p.y+Math.sin(a)*72,a+Math.PI/2+.5,1);}
  }

  // 도깨비
  const moving=Math.hypot(mv.x,mv.y)>.05||keys.size>0;
  if(Math.abs(mv.x)>.1)face=mv.x>0?1:-1;else if(keys.has('a')||keys.has('arrowleft'))face=-1;else if(keys.has('d')||keys.has('arrowright'))face=1;
  const hb=moving?Math.sin(T*16)*2:Math.sin(T*4)*.8;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(p.x,p.y+16,12,4,0,0,7);ctx.fill();
  ctx.globalAlpha=g.iframe>0&&Math.floor(T*20)%2?.45:1;
  drawSpr(S.hero,p.x,p.y+hb,38,face<0);
  ctx.globalAlpha=1;
  const hw=34;ctx.fillStyle='#000';ctx.fillRect(p.x-hw/2-1,p.y+22,hw+2,7);ctx.fillStyle='#5a1414';ctx.fillRect(p.x-hw/2,p.y+23,hw,5);ctx.fillStyle='#46d14a';ctx.fillRect(p.x-hw/2,p.y+23,hw*p.hp/p.maxHp,5);

  // 참격(총알)
  for(const b of g.bullets){if(!vis(b.x,b.y,20))continue;const a=Math.atan2(b.vy,b.vx);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
    ctx.fillStyle='rgba(80,180,255,.45)';ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(0,-6);ctx.lineTo(10,0);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#bfe6ff';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(0,-3.5);ctx.lineTo(9,0);ctx.lineTo(0,3.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-4,-1,10,2);ctx.restore();}

  // 데미지 숫자
  for(const f of g.floaters){ctx.globalAlpha=Math.min(1,f.life*3);outline('-'+f.text,f.x,f.y,f.kind?15:13,f.kind?'#ff9a3a':'#fff','center');}
  ctx.globalAlpha=1;

  /* ----- 화면 좌표 ----- */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(g.hurt>0){ctx.fillStyle='rgba(220,30,30,'+(g.hurt/.2*.25)+')';ctx.fillRect(0,0,W,H);}

  if(stick&&phase==='playing'){
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(stick.ox,stick.oy,50,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(stick.ox+stick.dx,stick.oy+stick.dy,22,0,7);ctx.fill();
  }

  // HUD: 상단 경험치 바 + LV
  const hs=Math.max(1,Math.min(1.6,W/520)),bh=18*hs;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,bh+4);ctx.fillStyle='#161a3a';ctx.fillRect(3,3,W-6,bh-2);
  const xw=(W-6)*Math.min(1,p.xp/p.xpNext);
  ctx.fillStyle='#2f6fe0';ctx.fillRect(3,3,xw,bh-2);ctx.fillStyle='#6fb2ff';ctx.fillRect(3,3,xw,(bh-2)/3);
  outline('LV '+p.level,10,bh/2+2,13*hs,'#fff');
  // 스킬 아이콘
  const icons=[{t:'b',l:g.stats.bullets}];if(g.stats.blades)icons.push({t:'c',l:g.stats.blades});if(g.upgrades.fire)icons.push({t:'f',l:g.upgrades.fire});
  icons.forEach((ic,i)=>{const ix=8+i*(34*hs),iy=bh+10,sz=30*hs;
    ctx.fillStyle='#000';ctx.fillRect(ix-2,iy-2,sz+4,sz+4);ctx.fillStyle='#2a2f5e';ctx.fillRect(ix,iy,sz,sz);
    if(ic.t==='c')club(ix+sz/2,iy+sz/2,-.7,.55*hs);
    else if(ic.t==='f'){ctx.font=(18*hs)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔥',ix+sz/2,iy+sz/2+1);}
    else{ctx.save();ctx.translate(ix+sz/2,iy+sz/2);ctx.rotate(-.6);ctx.fillStyle='#8fd0ff';ctx.fillRect(-9*hs,-2*hs,18*hs,4*hs);ctx.fillStyle='#fff';ctx.fillRect(-3*hs,-1*hs,10*hs,2*hs);ctx.restore();}
    outline(String(ic.l),ix+sz-2,iy+sz-4,11*hs,'#ffd84a','right');});
  // 타이머 / 엽전 / 처치
  outline(fmt(g.time),W/2,bh+22*hs,26*hs,'#fff','center');
  outline('●',W-96*hs,bh+20*hs,14*hs,'#ffc933','center');outline(String(g.coins),W-84*hs,bh+20*hs,16*hs,'#ffe38a','left');
  outline('☠',W-96*hs,bh+44*hs,14*hs,'#e6e6e6','center');outline(String(g.kills),W-84*hs,bh+44*hs,16*hs,'#fff','left');
  // 콤보
  if(g.combo>=5){
    if(g.combo!==lastCombo){popT=.15;lastCombo=g.combo;}
    const pop=1+popT*3,cxp=W-14*hs,cyp=H*.4;
    ctx.save();ctx.translate(cxp,cyp);ctx.scale(pop,pop);
    outline('x'+g.combo,0,0,34*hs,'#ffb02e','right');outline('COMBO!',0,28*hs,18*hs,'#ff4a3a','right');ctx.restore();
  }else lastCombo=0;
  if(popT>0)popT-=1/60;
}

let last=performance.now(),prevHp=100;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(phase==='playing'&&!choosing){
    let mx=mv.x,my=mv.y;
    if(keys.size){mx+=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);my+=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);}
    step(g,dt,mx,my);
    if(g.hurt>.15)shake=.2;else shake=Math.max(0,shake-dt);
    if(g.over)gameOver();else if(g.pendingLevel>0)levelUp();
  }
  draw();requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
window.__game=()=>g;
})();
</script>
