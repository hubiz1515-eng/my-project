<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>탕탕 특공대 - 귀신 천마리</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d1a;overflow:hidden;font-family:"DungGeunMo","Galmuri11",ui-monospace,Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic",monospace;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  #ov{position:fixed;inset:0;background:rgba(6,8,20,.68);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:#fff;text-align:center}
  #ov.hide{display:none}
  .t1{font-size:15px;color:#9fb4ff;letter-spacing:4px}
  h1{margin:0;font-size:46px;font-weight:900;color:#ff3b3b;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;letter-spacing:2px}
  h2{margin:0;font-size:30px;color:#ffd84a;text-shadow:3px 3px 0 #000}
  p{margin:0;line-height:1.7;color:#d7ddf5;white-space:pre-line;font-size:15px}
  .best{color:#ffd84a;font-weight:700}
  button{font:inherit;cursor:pointer}
  .btn{background:#e8472c;color:#fff;border:4px solid #000;box-shadow:inset 0 -6px 0 #a02a14,inset 0 4px 0 #ff8a5b;padding:12px 38px;font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000}
  .btn:active{transform:translateY(2px)}
  .card{width:100%;max-width:400px;display:flex;align-items:center;gap:14px;background:#262a52;border:4px solid #000;box-shadow:inset 0 0 0 3px #4a52a3;padding:12px 14px;color:#fff;text-align:left}
  .card:hover,.card:focus{background:#343a72;box-shadow:inset 0 0 0 3px #ffd84a;outline:0}
  .card .e{font-size:32px}.card b{font-size:17px}.card i{color:#ffd84a;font-style:normal;font-size:12px;margin-left:6px}.card small{display:block;color:#c9d0f5;margin-top:3px;font-size:13px}
  @keyframes glow{0%,100%{text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 14px #ff3b3b}50%{text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 34px #ff9a3b}}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  h1{animation:glow 1.8s ease-in-out infinite,bob 2.4s ease-in-out infinite}
  .btn#go{animation:pop 1.1s ease-in-out infinite}
  .card{animation:pop .5s ease-out 1}
  #btns{position:fixed;right:10px;bottom:10px;display:flex;gap:8px;z-index:5}
  #btns button{width:44px;height:44px;font-size:20px;background:rgba(10,12,30,.7);color:#fff;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a52a3;padding:0}
  .tbl{border-collapse:collapse;font-size:14px;color:#e8ecff}.tbl th{color:#9fb4ff;padding:4px 10px;font-weight:400}.tbl td{padding:5px 10px;text-align:center;border-top:1px solid #343a72}.tbl tr.me td{color:#ffd84a;font-weight:700;background:rgba(255,216,74,.12)}
  .new{color:#ffd84a;font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000;animation:pop .8s ease-in-out infinite}
  #sp{position:fixed;left:calc(50% - 38px);bottom:12px;width:76px;height:76px;border-radius:50%;border:4px solid #000;color:#fff;z-index:5;display:none;padding:0;background:#3b4080;font:inherit;touch-action:manipulation}
  #sp.show{display:block}
  #sp .in{position:absolute;inset:6px;border-radius:50%;background:#15183a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.25;font-weight:700}
  #sp .in b{font-size:22px;line-height:1}
  #sp .ch{position:absolute;top:-10px;right:-8px;background:#e8472c;border:3px solid #000;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:19px;text-align:center;font-weight:900}
  #sp.ready{animation:pop .6s ease-in-out infinite;box-shadow:0 0 24px #ffd84a;background:#ffd84a}
  #sp.ready .in{background:#7a3a10;color:#ffe9a0}
  #ov.solid{background:#05060f}
  .dfs{display:flex;gap:6px}
  .dif{opacity:.55;font-weight:800}.dif.on{opacity:1;box-shadow:inset 0 0 0 3px currentColor}
  .small{background:#262a52;color:#fff;border:3px solid #000;box-shadow:inset 0 0 0 2px #4a52a3;padding:8px 16px;font-size:14px}
  #ov{z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns"><button id="bp" title="일시정지 (P)">⏸</button><button id="bm" title="소리 (M)">🔊</button></div>
<button id="sp"><span class="in"><b>💥</b><span id="spt">0/20</span></span><span class="ch" id="spc">0</span></button>
<div id="ov"></div>
<script>
// 탕탕 특공대 스타일 서바이버 슈터의 순수 게임 로직 (React 에 의존하지 않음)
const WORLD = 2400;
/** 필살기: 적을 SPECIAL_COST 마리 처치할 때마다 1회 충전 (최대 MAX_CHARGES 회) */
const SPECIAL_COST = 20;
const MAX_CHARGES = 3;
/**
 * 난이도. 0(쉬움)이 기본 밸런스이고 위로 갈수록 적이 단단하고(hp) 아프고(dmg) 많고(spawn) 빨라진다(speed).
 * grow = 분당 추가 체력 증가율(복리), 난이도 배율은 초반 40%에서 시작해 약 3분에 100%로 올라간다
 * xp = 경험치 획득 배율, regen = 기본 체력 재생, heal = 떡 회복량, elite = 정예 출현 확률,
 * horde/hordeN = 포위 웨이브 간격(초)/마릿수, bossShots = 보스가 4초마다 뿌리는 탄막 수
 */
const DIFFICULTIES = [
    { name: '쉬움', hp: 1, dmg: 1, spawn: 1, speed: 1, grow: 0, xp: 1, regen: 0.4, heal: 25, elite: 0, horde: 75, hordeN: 40, bossShots: 0 },
    { name: '보통', hp: 1.25, dmg: 1.25, spawn: 1.15, speed: 1.05, grow: 0.08, xp: 0.9, regen: 0.2, heal: 20, elite: 0.04, horde: 65, hordeN: 50, bossShots: 6 },
    { name: '어려움', hp: 1.5, dmg: 1.5, spawn: 1.3, speed: 1.1, grow: 0.12, xp: 0.8, regen: 0, heal: 15, elite: 0.08, horde: 55, hordeN: 60, bossShots: 8 },
    { name: '지옥', hp: 2, dmg: 2, spawn: 1.6, speed: 1.15, grow: 0.18, xp: 0.7, regen: 0, heal: 10, elite: 0.14, horde: 45, hordeN: 70, bossShots: 10 },
];
const D = (g) => DIFFICULTIES[g.diff];
/** 난이도 배율 적용 강도: 시작 직후 40% → 약 3분에 100% */
const easeIn = (g) => Math.min(1, 0.4 + g.time / 200);
const UPGRADES = [
    { id: 'damage', name: '공격력 강화', desc: '총알 피해 +25%', emoji: '💥', max: 8 },
    { id: 'rate', name: '연사 속도', desc: '발사 간격 -15%', emoji: '⚡', max: 8 },
    { id: 'multi', name: '다중 사격', desc: '한 번에 발사하는 총알 +1', emoji: '🔫', max: 5 },
    { id: 'pierce', name: '관통탄', desc: '총알이 적 1명 더 관통', emoji: '🎯', max: 4 },
    { id: 'range', name: '사거리 증가', desc: '조준 사거리 +20%', emoji: '🔭', max: 4 },
    { id: 'speed', name: '이동 속도', desc: '이동 속도 +12%', emoji: '👟', max: 5 },
    { id: 'hp', name: '최대 체력', desc: '최대 체력 +25, 체력 회복', emoji: '❤️', max: 8 },
    { id: 'regen', name: '체력 재생', desc: '초당 체력 +1 회복', emoji: '🩹', max: 5 },
    { id: 'magnet', name: '자석', desc: '경험치 획득 범위 +50%', emoji: '🧲', max: 5 },
    { id: 'blade', name: '도깨비 방망이', desc: '몸 주위를 도는 방망이 +1', emoji: '🏏', max: 6 },
    { id: 'thunder', name: '도깨비 번개', desc: '주기적으로 적에게 번개를 내리침', emoji: '⚡', max: 6 },
    { id: 'fire', name: '도깨비불', desc: '주기적으로 주변에 불꽃을 터뜨림', emoji: '🔥', max: 6 },
];
function createGame(diff = 0) {
    const d = DIFFICULTIES[diff];
    return {
        time: 0,
        kills: 0,
        over: false,
        pendingLevel: 0,
        nextId: 1,
        spawnT: 0.5,
        bossesSpawned: 0,
        fireT: 0,
        angle: -Math.PI / 2,
        orbitAngle: 0,
        iframe: 0,
        view: { w: 400, h: 400 },
        coins: 0,
        combo: 0,
        comboT: 0,
        bestCombo: 0,
        burstT: 2,
        hordeAt: d.horde,
        diff,
        hurt: 0,
        charges: 0,
        chargeKills: 0,
        lockCharge: false,
        shots: [],
        thunderT: 2.5,
        thunders: [],
        events: [],
        player: { x: WORLD / 2, y: WORLD / 2, hp: 100, maxHp: 100, level: 1, xp: 0, xpNext: 5, r: 14 },
        stats: { damage: 10, fireInterval: 0.45, bullets: 1, pierce: 1, range: 320, speed: 150, magnet: 70, regen: d.regen, blades: 0 },
        upgrades: { damage: 0, rate: 0, multi: 0, pierce: 0, speed: 0, hp: 0, magnet: 0, regen: 0, blade: 0, range: 0, fire: 0, thunder: 0 },
        enemies: [],
        bullets: [],
        gems: [],
        pickups: [],
        floaters: [],
        bursts: [],
    };
}
const BULLET_SPEED = 520;
function emit(g, t, x, y, k) {
    if (g.events.length < 80)
        g.events.push({ t, x, y, k });
}
const MAX_ENEMIES = 260;
const BLADE_RADIUS = 72;
const BLADE_HIT_R = 16;
function bladePositions(g) {
    const n = g.stats.blades;
    const out = [];
    for (let i = 0; i < n; i++) {
        const a = g.orbitAngle + (i * Math.PI * 2) / n;
        out.push({ x: g.player.x + Math.cos(a) * BLADE_RADIUS, y: g.player.y + Math.sin(a) * BLADE_RADIUS });
    }
    return out;
}
function pickUpgrades(g, count = 3) {
    const pool = UPGRADES.filter((u) => g.upgrades[u.id] < u.max);
    const out = [];
    while (out.length < count && pool.length) {
        out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    return out;
}
function applyUpgrade(g, id) {
    g.upgrades[id]++;
    const s = g.stats;
    switch (id) {
        case 'damage':
            s.damage *= 1.25;
            break;
        case 'rate':
            s.fireInterval *= 0.85;
            break;
        case 'multi':
            s.bullets += 1;
            break;
        case 'pierce':
            s.pierce += 1;
            break;
        case 'range':
            s.range *= 1.2;
            break;
        case 'speed':
            s.speed *= 1.12;
            break;
        case 'hp':
            g.player.maxHp += 25;
            g.player.hp = Math.min(g.player.maxHp, g.player.hp + 40);
            break;
        case 'regen':
            s.regen += 1;
            break;
        case 'magnet':
            s.magnet *= 1.5;
            break;
        case 'blade':
            s.blades += 1;
            break;
        case 'fire':
        case 'thunder': break;
    }
    g.pendingLevel = Math.max(0, g.pendingLevel - 1);
}
function spawnEnemy(g, kind, angle, at) {
    const minutes = g.time / 60;
    const scale = 1 + minutes * 0.35;
    const a = angle ?? Math.random() * Math.PI * 2;
    const d = Math.hypot(g.view.w, g.view.h) / 2 + 30;
    const x = Math.min(WORLD - 20, Math.max(20, at ? at.x : g.player.x + Math.cos(a) * d));
    const y = Math.min(WORLD - 20, Math.max(20, at ? at.y : g.player.y + Math.sin(a) * d));
    let e;
    switch (kind) {
        case 'fast':
            e = { kind, hp: 12 * scale, r: 11, speed: 115, dmg: 4, xp: 1 };
            break;
        case 'tank':
            e = { kind, hp: 70 * scale, r: 18, speed: 48, dmg: 9, xp: 4 };
            break;
        case 'boss':
            e = { kind, hp: 500 * (1 + g.bossesSpawned * 0.8) * (1 + minutes * 0.2), r: 36, speed: 58, dmg: 20, xp: 40 };
            break;
        case 'tiger':
            e = { kind, hp: 60 * scale, r: 17, speed: 70, dmg: 14, xp: 3 };
            break;
        case 'egg':
            e = { kind, hp: 40 * scale, r: 15, speed: 55, dmg: 6, xp: 2 };
            break;
        case 'mini':
            e = { kind, hp: 8 * scale, r: 8, speed: 105, dmg: 3, xp: 1 };
            break;
        case 'archer':
            e = { kind, hp: 25 * scale, r: 12, speed: 50, dmg: 5, xp: 3 };
            break;
        default: e = { kind: 'grunt', hp: 22 * scale, r: 13, speed: 70, dmg: 5, xp: 1 };
    }
    const dd = D(g);
    const mul = (v) => 1 + (v - 1) * easeIn(g);
    e.hp *= mul(dd.hp) * Math.pow(1 + dd.grow, minutes);
    e.dmg = Math.round(e.dmg * mul(dd.dmg) * (1 + minutes * 0.08 * (1 + g.diff)));
    e.speed *= mul(dd.speed) * (1 + Math.min(0.4, minutes * 0.04)); // 시간이 갈수록 적이 점점 빨라진다
    let elite = false;
    if (kind !== 'boss' && kind !== 'mini' && g.time > 40 && Math.random() < dd.elite * (1 + minutes * 0.1)) {
        elite = true;
        e.hp *= 4;
        e.dmg = Math.round(e.dmg * 1.4);
        e.r *= 1.3;
        e.xp *= 3;
    }
    g.enemies.push({ ...e, elite, id: g.nextId++, x, y, maxHp: e.hp, flash: 0, orbitCd: 0, age: 0, st: 0, ai: 1 + Math.random() * 2, vx: 0, vy: 0 });
    if (kind === 'boss')
        emit(g, 'boss', x, y);
}
function damageEnemy(g, e, dmg, kind = 0) {
    e.hp -= dmg;
    e.flash = 0.08;
    emit(g, 'hit', e.x, e.y, String(kind));
    if (g.floaters.length < 50) {
        g.floaters.push({ x: e.x + (Math.random() - 0.5) * 14, y: e.y - e.r, text: Math.round(dmg), life: 0.6, kind });
    }
    if (e.hp <= 0 && e.xp > 0) {
        const boss = e.kind === 'boss';
        emit(g, 'kill', e.x, e.y, e.kind);
        if (!g.lockCharge && g.charges < MAX_CHARGES && ++g.chargeKills >= SPECIAL_COST) {
            g.chargeKills = 0;
            g.charges++;
            emit(g, 'ready', g.player.x, g.player.y);
        }
        if (e.kind === 'egg' && g.enemies.length < MAX_ENEMIES + 20) {
            for (let i = 0; i < 2; i++)
                spawnEnemy(g, 'mini', undefined, { x: e.x + (Math.random() - 0.5) * 24, y: e.y + (Math.random() - 0.5) * 24 });
        }
        g.kills++;
        g.combo++;
        g.comboT = 2.2;
        g.bestCombo = Math.max(g.bestCombo, g.combo);
        g.gems.push({ id: g.nextId++, x: e.x, y: e.y, v: e.xp });
        const coins = boss ? 8 : Math.random() < 0.22 ? 1 : 0;
        for (let i = 0; i < coins; i++) {
            g.pickups.push({ id: g.nextId++, x: e.x + (Math.random() - 0.5) * 30, y: e.y + (Math.random() - 0.5) * 30, type: 'coin' });
        }
        if (boss || Math.random() < 0.012 * (g.diff > 1 ? 0.6 : 1))
            g.pickups.push({ id: g.nextId++, x: e.x, y: e.y, type: 'heal' });
        e.xp = 0; // 중복 처리 방지 (hp<=0 로 이후 제거)
    }
}
function step(g, dt, mx, my) {
    if (g.over)
        return;
    const p = g.player;
    const s = g.stats;
    g.time += dt;
    // 이동
    const ml = Math.hypot(mx, my);
    if (ml > 0.05) {
        const k = Math.min(1, ml) / ml;
        p.x = Math.min(WORLD - p.r, Math.max(p.r, p.x + mx * k * s.speed * dt));
        p.y = Math.min(WORLD - p.r, Math.max(p.r, p.y + my * k * s.speed * dt));
    }
    if (s.regen > 0)
        p.hp = Math.min(p.maxHp, p.hp + s.regen * dt);
    g.iframe = Math.max(0, g.iframe - dt);
    g.orbitAngle += dt * 3;
    g.hurt = Math.max(0, g.hurt - dt);
    if (g.combo > 0 && (g.comboT -= dt) <= 0)
        g.combo = 0;
    for (const f of g.floaters) {
        f.y -= 32 * dt;
        f.life -= dt;
    }
    g.floaters = g.floaters.filter((f) => f.life > 0);
    for (const b of g.bursts)
        b.life -= dt;
    g.bursts = g.bursts.filter((b) => b.life > 0);
    // 도깨비 번개: 화면 안의 무작위 적에게 낙뢰
    for (const th of g.thunders)
        th.life -= dt;
    g.thunders = g.thunders.filter((th) => th.life > 0);
    const tl = g.upgrades.thunder;
    if (tl > 0 && (g.thunderT -= dt) <= 0) {
        g.thunderT = Math.max(1, 3.4 - 0.4 * tl);
        const near = g.enemies.filter((e) => e.hp > 0 && Math.abs(e.x - p.x) < g.view.w / 2 && Math.abs(e.y - p.y) < g.view.h / 2);
        for (let i = 0; i < 1 + Math.floor(tl / 2) && near.length; i++) {
            const t = near.splice(Math.floor(Math.random() * near.length), 1)[0];
            g.thunders.push({ x: t.x, y: t.y, life: 0.3 });
            emit(g, 'thunder', t.x, t.y);
            for (const e of g.enemies) {
                if (e.hp > 0 && (e.x - t.x) ** 2 + (e.y - t.y) ** 2 < (46 + e.r) ** 2)
                    damageEnemy(g, e, s.damage * 3, 2);
            }
        }
    }
    // 도깨비불: 주기적으로 주변에 폭발
    const fl = g.upgrades.fire;
    if (fl > 0 && (g.burstT -= dt) <= 0) {
        g.burstT = Math.max(1.2, 4.2 - 0.45 * fl);
        const R = 90 + 16 * fl;
        g.bursts.push({ x: p.x, y: p.y, r: R, life: 0.45, maxLife: 0.45 });
        emit(g, 'burst', p.x, p.y);
        for (const e of g.enemies) {
            if (e.hp > 0 && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (R + e.r) ** 2)
                damageEnemy(g, e, s.damage * (1.5 + 0.4 * fl), 1);
        }
    }
    // 적 스폰
    g.spawnT -= dt;
    if (g.spawnT <= 0) {
        const t = g.time;
        g.spawnT = Math.max(0.05, (0.7 - t * 0.006) / (1 + (D(g).spawn - 1) * easeIn(g)));
        const batch = 1 + Math.floor(t / 25);
        for (let i = 0; i < batch && g.enemies.length < MAX_ENEMIES; i++) {
            const r = Math.random();
            let kind = 'grunt';
            if (t > 15 && r < 0.16)
                kind = 'fast';
            else if (t > 20 && r < 0.26)
                kind = 'egg';
            else if (t > 30 && r < 0.34)
                kind = 'tiger';
            else if (t > 35 && r < 0.44)
                kind = 'tank';
            else if (t > 45 && r < 0.52)
                kind = 'archer';
            spawnEnemy(g, kind);
        }
    }
    // 귀신 떼: 일정 간격으로 플레이어를 둘러싸는 포위 웨이브
    if (g.time >= g.hordeAt) {
        g.hordeAt += D(g).horde;
        emit(g, 'horde', p.x, p.y);
        for (let i = 0; i < D(g).hordeN && g.enemies.length < MAX_ENEMIES; i++)
            spawnEnemy(g, 'grunt', (i / D(g).hordeN) * Math.PI * 2);
    }
    if (g.time >= (g.bossesSpawned + 1) * 60) {
        spawnEnemy(g, 'boss');
        g.bossesSpawned++;
    }
    // 자동 조준 + 발사
    let target = null;
    let best = s.range * s.range;
    for (const e of g.enemies) {
        if (e.hp <= 0)
            continue;
        const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
        if (d < best) {
            best = d;
            target = e;
        }
    }
    if (target)
        g.angle = Math.atan2(target.y - p.y, target.x - p.x);
    g.fireT -= dt;
    if (target && g.fireT <= 0) {
        g.fireT = s.fireInterval;
        emit(g, 'shoot', p.x, p.y);
        const n = s.bullets;
        for (let i = 0; i < n; i++) {
            const a = g.angle + (i - (n - 1) / 2) * 0.16;
            g.bullets.push({ id: g.nextId++, x: p.x, y: p.y, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, dmg: s.damage, life: s.range / BULLET_SPEED + 0.25, pierce: s.pierce, hit: new Set() });
        }
    }
    // 총알
    for (const b of g.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        for (const e of g.enemies) {
            if (e.hp <= 0 || b.hit.has(e.id))
                continue;
            const rr = e.r + 4;
            if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr) {
                b.hit.add(e.id);
                const crit = Math.random() < 0.1;
                damageEnemy(g, e, b.dmg * (crit ? 2 : 1), crit ? 3 : 0);
                const kb = e.kind === 'boss' ? 0.5 : 4 / BULLET_SPEED;
                e.x += b.vx * kb;
                e.y += b.vy * kb;
                if (b.pierce-- <= 0) {
                    b.life = 0;
                    break;
                }
            }
        }
    }
    g.bullets = g.bullets.filter((b) => b.life > 0 && b.x > 0 && b.y > 0 && b.x < WORLD && b.y < WORLD);
    // 회전 칼날
    const blades = s.blades ? bladePositions(g) : [];
    // 적 이동 / 접촉
    for (const e of g.enemies) {
        e.flash = Math.max(0, e.flash - dt);
        e.orbitCd = Math.max(0, e.orbitCd - dt);
        e.age += dt;
        if (e.hp <= 0)
            continue;
        const dx = p.x - e.x;
        const dy = p.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const wob = Math.sin(g.time * 3 + e.id) * 0.35;
        let sp = e.speed;
        let mvx = (dx - dy * wob) / d;
        let mvy = (dy + dx * wob) / d;
        if (e.kind === 'boss' && D(g).bossShots > 0) {
            // 저승사자: 4초마다 사방으로 불덩이를 뿌린다
            e.ai -= dt;
            if (e.ai <= 0) {
                e.ai = 4;
                const n = D(g).bossShots;
                for (let i = 0; i < n; i++) {
                    const a = (i / n) * Math.PI * 2 + g.time;
                    g.shots.push({ id: g.nextId++, x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, life: 4, dmg: Math.round(10 * D(g).dmg) });
                }
                emit(g, 'eshot', e.x, e.y);
            }
        }
        if (e.kind === 'tiger') {
            // 호랑이: 가까워지면 잠깐 웅크렸다가(예고) 일직선으로 돌진
            e.ai -= dt;
            if (e.st === 0 && e.ai <= 0 && d < 340) {
                e.st = 1;
                e.ai = 0.6;
                e.vx = dx / d;
                e.vy = dy / d;
            }
            else if (e.st === 1) {
                sp = 0;
                if (e.ai <= 0) {
                    e.st = 2;
                    e.ai = 0.5;
                }
            }
            else if (e.st === 2) {
                mvx = e.vx;
                mvy = e.vy;
                sp = 380;
                if (e.ai <= 0) {
                    e.st = 0;
                    e.ai = 2.5 + Math.random() * 1.5;
                }
            }
        }
        else if (e.kind === 'archer') {
            // 해골 궁수: 일정 거리를 유지하며 맴돌고, 주기적으로 불화살을 쏜다
            e.ai -= dt;
            const want = d < 170 ? -1 : d > 240 ? 1 : 0;
            mvx = (dx / d) * want - (dy / d) * 0.5;
            mvy = (dy / d) * want + (dx / d) * 0.5;
            if (e.ai <= 0 && d < 420) {
                e.ai = 2.2 + Math.random() * 0.6;
                g.shots.push({ id: g.nextId++, x: e.x, y: e.y, vx: (dx / d) * 170 * (1 + 0.1 * g.diff), vy: (dy / d) * 170 * (1 + 0.1 * g.diff), life: 3.5, dmg: Math.round(8 * D(g).dmg * (1 + (g.time / 60) * 0.08)) });
                emit(g, 'eshot', e.x, e.y);
            }
        }
        e.x = Math.min(WORLD - 10, Math.max(10, e.x + mvx * sp * dt));
        e.y = Math.min(WORLD - 10, Math.max(10, e.y + mvy * sp * dt));
        if (e.orbitCd <= 0) {
            for (const bl of blades) {
                const rr = e.r + BLADE_HIT_R;
                if ((e.x - bl.x) ** 2 + (e.y - bl.y) ** 2 < rr * rr) {
                    damageEnemy(g, e, s.damage * 0.8);
                    e.orbitCd = 0.4;
                    break;
                }
            }
        }
        if (e.hp > 0 && g.iframe <= 0 && d < e.r + p.r) {
            p.hp -= e.dmg;
            g.iframe = 0.6;
            g.hurt = 0.2;
            emit(g, 'hurt', p.x, p.y);
        }
    }
    g.enemies = g.enemies.filter((e) => e.hp > 0);
    // 적의 화살
    for (const sh of g.shots) {
        sh.x += sh.vx * dt;
        sh.y += sh.vy * dt;
        sh.life -= dt;
        if (g.iframe <= 0 && (sh.x - p.x) ** 2 + (sh.y - p.y) ** 2 < (p.r + 5) ** 2) {
            p.hp -= sh.dmg;
            g.iframe = 0.6;
            g.hurt = 0.2;
            emit(g, 'hurt', p.x, p.y);
            sh.life = 0;
        }
    }
    g.shots = g.shots.filter((sh) => sh.life > 0);
    // 경험치 젬
    for (const gem of g.gems) {
        const dx = p.x - gem.x;
        const dy = p.y - gem.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < s.magnet) {
            gem.x += (dx / d) * 420 * dt;
            gem.y += (dy / d) * 420 * dt;
        }
        if (d < p.r + 6) {
            emit(g, 'gem', gem.x, gem.y);
            p.xp += gem.v * D(g).xp;
            gem.v = 0;
        }
    }
    g.gems = g.gems.filter((gem) => gem.v > 0);
    for (const k of g.pickups) {
        const dx = p.x - k.x;
        const dy = p.y - k.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < s.magnet) {
            k.x += (dx / d) * 420 * dt;
            k.y += (dy / d) * 420 * dt;
        }
        if (d < p.r + 8) {
            emit(g, k.type, k.x, k.y);
            if (k.type === 'coin')
                g.coins++;
            else
                p.hp = Math.min(p.maxHp, p.hp + D(g).heal);
            k.id = -1;
        }
    }
    g.pickups = g.pickups.filter((k) => k.id >= 0);
    while (p.xp >= p.xpNext) {
        p.xp -= p.xpNext;
        p.level++;
        emit(g, 'level', p.x, p.y);
        p.xpNext = Math.round(p.xpNext * 1.22 + 2);
        g.pendingLevel++;
    }
    if (p.hp <= 0) {
        p.hp = 0;
        g.over = true;
    }
}
/** 필살기 '도깨비 대폭발': 화면 안의 모든 적에게 큰 피해 + 밀쳐내기, 적 화살 제거, 잠시 무적 */
function useSpecial(g) {
    if (g.over || g.charges <= 0)
        return false;
    g.charges--;
    const p = g.player;
    const R = Math.hypot(g.view.w, g.view.h) / 2 + 30;
    const dmg = g.stats.damage * 10 + 40;
    g.lockCharge = true; // 필살기로 잡은 적은 충전에 포함하지 않는다
    for (const e of g.enemies.slice()) {
        if (e.hp <= 0)
            continue;
        const dx = e.x - p.x;
        const dy = e.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > R + e.r)
            continue;
        damageEnemy(g, e, e.kind === 'boss' ? Math.max(dmg, e.maxHp * 0.25) : dmg, 1);
        if (e.hp > 0) {
            e.x += (dx / d) * 120;
            e.y += (dy / d) * 120;
        }
    }
    g.lockCharge = false;
    g.shots = [];
    g.iframe = Math.max(g.iframe, 1.2);
    g.bursts.push({ x: p.x, y: p.y, r: R, life: 0.7, maxLife: 0.7 });
    emit(g, 'special', p.x, p.y);
    return true;
}

/* ---------- 오디오: WebAudio 로 효과음·배경음악을 코드로 합성 ---------- */
const Au=(()=>{
  let ctx=null,master,bgmG,sfxG,noiseBuf,muted=false,bgmOn=false,nextT=0,step=0,intensity=0,chain=0,chainT=0;const lastT={};
  try{muted=localStorage.getItem('tangtang:mute')==='1'}catch(e){}
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const ok=(k,ms)=>{const n=performance.now();if(n-(lastT[k]||0)<ms)return false;lastT[k]=n;return true;};
  function init(){
    if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:.8;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    bgmG=ctx.createGain();bgmG.gain.value=.32;bgmG.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=.9;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function resume(){if(ctx&&ctx.state==='suspended')ctx.resume();}
  function tone(f,dur,type,vol,o){
    o=o||{};if(!ctx)return;const t=(o.at||ctx.currentTime)+(o.delay||0);
    const os=ctx.createOscillator(),g=ctx.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(o.atk||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    if(o.lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);fl.connect(g);}else os.connect(g);
    g.connect(o.dest||sfxG);os.start(t);os.stop(t+dur+.03);
  }
  function noise(dur,vol,o){
    o=o||{};if(!ctx)return;const t=(o.at||ctx.currentTime)+(o.delay||0);
    const src=ctx.createBufferSource();src.buffer=noiseBuf;
    const fl=ctx.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1500,t);fl.Q.value=o.q||1;
    if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(fl);fl.connect(g);g.connect(o.dest||sfxG);src.start(t,Math.random()*.5);src.stop(t+dur+.02);
  }

    if(!ctx||muted)return;

      case 'shoot':if(ok(n,70))tone(900+Math.random()*120,.07,'square',.035,{to:380});break;
      case 'hit':if(ok(n,45))noise(.05,.05,{f:2500,q:2});break;
      case 'kill':if(ok(n,35)){tone(260+Math.random()*60,.12,'triangle',.07,{to:90});noise(.08,.04,{f:900});}break;
      case 'gem':{const now=performance.now();chain=now-chainT<350?Math.min(chain+1,10):0;chainT=now;if(ok(n,30))tone(660*Math.pow(2,chain/6),.09,'sine',.05);break;}
      case 'coin':tone(1318,.07,'square',.04);tone(1760,.12,'square',.04,{delay:.07});break;
      case 'heal':[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.07,{delay:i*.07}));break;
      case 'hurt':tone(170,.2,'sawtooth',.12,{to:55,lp:900});noise(.12,.08,{f:300});break;
      case 'level':if(ok(n,700))[523,587,784,880,1175].forEach((f,i)=>tone(f,.18,'square',.05,{delay:i*.08,lp:3000}));tone(262,.6,'triangle',.08);break;
      case 'burst':noise(.55,.16,{type:'lowpass',f:1800,to:150});tone(140,.4,'sine',.18,{to:40});break;
      case 'thunder':if(ok(n,80)){noise(.22,.14,{type:'highpass',f:2500,to:6000});tone(90,.25,'sawtooth',.08,{to:40,lp:500});}break;
      case 'boss':tone(98,1.1,'sawtooth',.13,{to:73,lp:700});tone(103,1.1,'sawtooth',.1,{to:77,lp:700});noise(.8,.05,{type:'lowpass',f:400});break;
      case 'horde':for(let i=0;i<6;i++)tone(90+i*18,.18,'sine',.2,{to:50,delay:i*.12});break;
      case 'over':[392,370,330,262].forEach((f,i)=>tone(f,.4,'triangle',.1,{delay:i*.25}));break;
      case 'crit':if(ok(n,60)){tone(1568,.09,'triangle',.08,{to:2093});noise(.05,.06,{f:4000});}break;
      case 'bosskill':noise(1,.3,{type:'lowpass',f:3000,to:100});tone(110,.9,'sawtooth',.18,{to:30,lp:600});[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.4,'triangle',.07,{delay:.3+i*.06}));break;
      case 'combo':[659,784,988,1319,1568].forEach((f,i)=>tone(f,.1,'square',.05,{delay:i*.05,lp:3500}));break;
      case 'special':noise(1.2,.32,{type:'lowpass',f:4000,to:80});tone(60,1,'sine',.38,{to:30});tone(200,.6,'sawtooth',.1,{to:1600,lp:2500});[523,659,784,1047].forEach((f,i)=>tone(f,.5,'square',.05,{delay:.25+i*.04,lp:3000}));break;
      case 'ready':[988,1319].forEach((f,i)=>tone(f,.14,'triangle',.08,{delay:i*.09}));break;

  const sp=60/124/4,roots=[38,38,43,45],scale=[62,65,67,69,72,74,77];
  const lead=[[0,-1,-1,2,-1,3,-1,2,1,-1,0,-1,-1,-1,-1,-1],[0,-1,-1,1,-1,2,-1,3,4,-1,3,-1,2,-1,-1,-1],[2,-1,-1,3,-1,4,-1,5,4,-1,3,-1,2,-1,1,-1],[3,-1,2,-1,1,-1,0,-1,1,-1,2,-1,-1,-1,-1,-1]];
  function kick(t){tone(150,.16,'sine',.55,{at:t,to:45,dest:bgmG});}

  function hat(t,v){noise(.035,v,{at:t,type:'highpass',f:7000,dest:bgmG});}
  function sched(st,t){
    const bar=(st>>4)&3,s=st&15,root=roots[bar],L=intensity;
    if(s===0||s===8||(s===10&&L>0)||(L>1&&s===14&&bar%2))kick(t);
    if(s===4||s===12)snare(t);
    if(s%2===0)hat(t,s%4===2?.12:.07);else if(L>0&&Math.random()<.4)hat(t,.05);
    if(s===0||s===3||s===6||s===8||s===11||s===14)tone(mf(root+(s===6||s===14?12:0)),sp*1.8,'triangle',.24,{at:t,dest:bgmG,lp:500});
    if(L>=1){const d=lead[bar][s];if(d>=0){tone(mf(scale[d]),.3,'triangle',.17,{at:t,dest:bgmG,lp:2600});if(L>=2)tone(mf(scale[d]+12),.2,'sine',.05,{at:t,dest:bgmG});}}
    if(L>=2&&s%2===1)tone(mf(scale[(s>>1)%5]+(bar>1?12:0)),.1,'square',.022,{at:t,dest:bgmG,lp:3000});
    if(s===0&&bar===0)tone(mf(50),1.4,'sine',.1,{at:t,dest:bgmG});
  }
  setInterval(()=>{if(!ctx||!bgmOn||ctx.state!=='running')return;while(nextT<ctx.currentTime+.18){sched(step,nextT);nextT+=sp;step++;}},40);
  return{
    init,resume,sfx,
    play(){init();if(!ctx)return;resume();if(!bgmOn){bgmOn=true;nextT=ctx.currentTime+.05;}},
    stop(){bgmOn=false;},
    on:()=>bgmOn,
    setIntensity(v){intensity=v;},
    toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.8;try{localStorage.setItem('tangtang:mute',muted?'1':'0')}catch(e){}return muted;},
    muted:()=>muted,
  };
})();

function makeBG(){
  const c=document.createElement('canvas');c.width=c.height=WORLD;const x=c.getContext('2d');
  let s=20240;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  x.fillStyle='#46362b';x.fillRect(0,0,WORLD,WORLD);
  for(let j=0;j<WORLD;j+=16)for(let i=0;i<WORLD;i+=16){const r=R();if(r<.22){x.fillStyle='#3d2f26';x.fillRect(i,j,16,16);}else if(r<.32){x.fillStyle='#524033';x.fillRect(i,j,16,16);}}
  for(let n=0;n<260;n++){const gx=R()*WORLD,gy=R()*WORLD,rad=20+R()*50;
    for(let k=0;k<26;k++){const a=R()*6.28,d=R()*rad;x.fillStyle=R()<.5?'#2d4a3b':'#3a5a43';const q=4+((R()*3)|0)*2;x.fillRect((gx+Math.cos(a)*d)|0,(gy+Math.sin(a)*d)|0,q,q);}}
  for(let n=0;n<900;n++){x.fillStyle=R()<.5?'#6b5a4a':'#2e241d';x.fillRect((R()*WORLD)|0,(R()*WORLD)|0,3+((R()*3)|0),2);}
  const far=(px,py)=>Math.hypot(px-WORLD/2,py-WORLD/2)>240;
  // 한옥 지붕
  for(let n=0;n<16;n++){const bw=150+((R()*3)|0)*30,bh=90,bx=(R()*(WORLD-bw-40)+20)|0,by=(R()*(WORLD-bh-60)+20)|0;if(!far(bx+bw/2,by+bh/2))continue;
    x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx+8,by+bh,bw,14);
    x.fillStyle='#2a2236';x.fillRect(bx+10,by+bh-30,bw-20,40);
    x.fillStyle='#6b4a32';for(let q=bx+16;q<bx+bw-16;q+=24)x.fillRect(q,by+bh-30,5,40);
    x.fillStyle='#2f3f6e';x.fillRect(bx,by+10,bw,bh-34);
    x.fillStyle='#24325c';for(let q=by+16;q<by+bh-26;q+=8)x.fillRect(bx,q,bw,2);
    for(let q=bx+6;q<bx+bw;q+=12){x.fillStyle='#1d2a4f';x.fillRect(q,by+10,2,bh-34);}
    x.fillStyle='#3c4f8a';x.fillRect(bx+10,by,bw-20,12);x.fillStyle='#2a3a6c';x.fillRect(bx,by+10,10,6);x.fillRect(bx+bw-10,by+10,10,6);
    x.fillStyle='#3c4f8a';x.fillRect(bx-6,by+bh-26,14,6);x.fillRect(bx+bw-8,by+bh-26,14,6);}
  // 단풍나무
  for(let n=0;n<26;n++){const tx=(R()*(WORLD-80)+40)|0,ty=(R()*(WORLD-100)+60)|0;if(!far(tx,ty))continue;
    x.fillStyle='rgba(0,0,0,.3)';x.fillRect(tx-20,ty+10,44,10);
    x.fillStyle='#4a2f1f';x.fillRect(tx-4,ty-8,8,22);
    const cols=['#c4511d','#e0702a','#f09a3a','#a63d15'];
    for(let k=0;k<22;k++){x.fillStyle=cols[(R()*4)|0];const a=R()*6.28,d=R()*26;x.fillRect((tx+Math.cos(a)*d-6)|0,(ty-26+Math.sin(a)*d*.8-6)|0,12,12);}}
  // 등불
  for(let n=0;n<34;n++){const lx=(R()*(WORLD-40)+20)|0,ly=(R()*(WORLD-40)+20)|0;if(!far(lx,ly))continue;
    const g=x.createRadialGradient(lx,ly,2,lx,ly,46);g.addColorStop(0,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=g;x.fillRect(lx-46,ly-46,92,92);
    x.fillStyle='#4a2f1f';x.fillRect(lx-1,ly,3,16);x.fillStyle='#d9372b';x.fillRect(lx-5,ly-9,10,11);x.fillStyle='#ffd27a';x.fillRect(lx-3,ly-6,6,5);}
  x.fillStyle='rgba(12,16,48,.28)';x.fillRect(0,0,WORLD,WORLD);
  return c;
}

function fx(e){
  const r=Math.random;
  switch(e.t){
    case 'kill':{const cs=KC[e.k]||KC.grunt,boss=e.k==='boss',n=boss?60:9;
      for(let i=0;i<n;i++){const a=r()*6.283,v=50+r()*(boss?220:110);P(e.x,e.y,Math.cos(a)*v,Math.sin(a)*v-20,.4+r()*.4,cs[(r()*cs.length)|0],2+((r()*3)|0),160);}
      P(e.x,e.y,0,-45,.9,'rgba(200,220,255,.85)',6,-30);
      if(e.k==='tank')ring(e.x,e.y,34,.25,'180,200,255',3);
      if(boss){flash=.6;shake=.6;hitStop=.12;slow=.6;punch=.08;ring(e.x,e.y,340,.8,'255,255,255',9);ring(e.x,e.y,210,.6,'255,60,60',6);
        for(let i=0;i<40;i++){const a=r()*6.283,v=80+r()*200;P(e.x,e.y,Math.cos(a)*v,Math.sin(a)*v-160,1+r()*.6,'#ffe066',3+((r()*2)|0),320);}
        toast={text:'저승사자 처치!',c:'#ffd84a',t:2.2};}
      break;}
    case 'hit':
      if(e.k==='3'){for(let i=0;i<7;i++)P(e.x,e.y,(r()-.5)*260,(r()-.5)*260,.25,'#ffe14a',3,0);ring(e.x,e.y,24,.2,'255,225,80',3);}
      else for(let i=0;i<2;i++)P(e.x,e.y,(r()-.5)*120,(r()-.5)*120,.18,'#fff3a6',2,0);
      break;
    case 'shoot':{const a=g.angle;for(let i=0;i<3;i++){const sp=(r()-.5)*.6;P(e.x+Math.cos(a)*14,e.y+Math.sin(a)*14,Math.cos(a+sp)*140,Math.sin(a+sp)*140,.12,'#fff3a6',3,0);}recoil=1;break;}
    case 'coin':case 'heal':for(let i=0;i<6;i++)P(e.x,e.y,(r()-.5)*90,-30-r()*60,.4,e.t==='coin'?'#ffe066':'#ff9ab8',2,120);break;
    case 'gem':P(e.x,e.y,(r()-.5)*40,-30,.25,'#8fd0ff',2,0);break;
    case 'hurt':for(let i=0;i<14;i++){const a=r()*6.283,v=60+r()*100;P(e.x,e.y,Math.cos(a)*v,Math.sin(a)*v,.45,'#d62828',3,100);}hitStop=.05;ring(e.x,e.y,50,.25,'255,60,60',4);break;
    case 'level':for(let i=0;i<48;i++){const a=i/48*6.283;P(e.x,e.y,Math.cos(a)*170,Math.sin(a)*170,.8,i%2?'#ffd84a':'#fff3a6',3,0);}flash=.5;punch=.05;ring(e.x,e.y,260,.7,'255,216,74',7);ring(e.x,e.y,150,.5,'255,255,255',4);break;
    case 'thunder':for(let i=0;i<12;i++)P(e.x,e.y,(r()-.5)*240,(r()-.5)*240,.3,'#bfe6ff',2,0);ring(e.x,e.y,56,.28,'160,210,255',4);shake=Math.max(shake,.1);break;
    case 'burst':shake=Math.max(shake,.15);punch=Math.max(punch,.03);ring(e.x,e.y,150,.5,'255,140,40',6);break;
    case 'boss':toast={text:'⚠ 저승사자 출현!',c:'#ff4a3a',t:2.4};shake=.5;flash=.3;ring(e.x,e.y,200,.8,'255,60,60',6);break;
    case 'special':{flash=1;shake=.7;punch=.12;hitStop=.08;slow=.35;specialT=.6;
      ring(e.x,e.y,520,.7,'255,240,160',12);ring(e.x,e.y,380,.55,'255,160,60',9);ring(e.x,e.y,240,.45,'255,255,255',6);
      for(let i=0;i<90;i++){const a=i/90*6.283+r()*.1,v=260+r()*260;P(e.x,e.y,Math.cos(a)*v,Math.sin(a)*v,.7+r()*.4,i%3?'#ffd84a':'#fff3a6',3+((r()*3)|0),0);}
      toast={text:'도깨비 대폭발!',c:'#ffd84a',t:2};break;}
    case 'ready':if(phase==='playing')toast={text:'필살기 준비 완료!  SPACE',c:'#8fd0ff',t:1.8};break;
    case 'horde':toast={text:'귀신 떼가 몰려온다!',c:'#ffd84a',t:2.2};shake=.35;break;
  }
}
function handleEvents(sound){for(const e of g.events){let n=e.t;if(n==='hit'&&e.k==='3')n='crit';else if(n==='kill'&&e.k==='boss')n='bosskill';if(sound)Au.sfx(n);fx(e);}g.events.length=0;}
function updateParts(dt){
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.gr*dt;q.life-=dt;}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
  if(toast&&(toast.t-=dt)<=0)toast=null;
  flash=Math.max(0,flash-dt*2);specialT=Math.max(0,specialT-dt);punch=Math.max(0,punch-dt*.25);recoil=Math.max(0,recoil-dt*10);
  for(let i=rings.length-1;i>=0;i--){rings[i].t-=dt;if(rings[i].t<=0)rings.splice(i,1);}
}

cv.addEventListener('pointerdown',e=>{if(phase!=='playing'||choosing)return;cv.setPointerCapture(e.pointerId);stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};});
cv.addEventListener('pointermove',e=>{if(!stick||e.pointerId!==stick.id)return;const dx=e.clientX-stick.ox,dy=e.clientY-stick.oy,l=Math.hypot(dx,dy)||1,c=Math.min(l,MAXS);stick.dx=dx/l*c;stick.dy=dy/l*c;mv={x:stick.dx/MAXS,y:stick.dy/MAXS};});
const endp=e=>{if(stick&&e.pointerId===stick.id){stick=null;mv={x:0,y:0};}};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
const spBtn=document.getElementById('sp'),spT=document.getElementById('spt'),spC=document.getElementById('spc');let spKey='';
function doSpecial(){
  if(phase!=='playing'||choosing||paused)return;
  if(!useSpecial(g)){Au.sfx('deny');toast={text:'충전 중  '+g.chargeKills+' / '+SPECIAL_COST,c:'#9fb4ff',t:.9};}
}
spBtn.addEventListener('pointerdown',e=>{e.preventDefault();doSpecial();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)doSpecial();}});
addEventListener('keyup',e=>{if(e.code==='Space')e.preventDefault();});
function updSpecialUI(){
  const on=phase==='playing';const key=on+'|'+g.charges+'|'+g.chargeKills;if(key===spKey)return;spKey=key;
  spBtn.classList.toggle('show',on);spBtn.classList.toggle('ready',g.charges>0);
  spBtn.style.background=g.charges>0?'':'conic-gradient(#ffd84a '+(g.chargeKills/SPECIAL_COST*360)+'deg,#3b4080 0)';
  spT.textContent=g.charges>0?'SPACE':g.chargeKills+'/'+SPECIAL_COST;spC.textContent=g.charges;spC.style.display=g.charges>0?'':'none';
}

function resize(){
  dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  Z=Math.max(1,Math.min(W,H)/400);
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.6);
  vig.addColorStop(0,'rgba(5,6,20,0)');vig.addColorStop(1,'rgba(5,6,20,.7)');
}
addEventListener('resize',resize);resize();

/* ---------- 그리기 ---------- */
function outline(str,x,y,size,fill,align){
  ctx.font='900 '+size+'px '+getComputedStyle(document.body).fontFamily;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(3,size/5);ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.strokeText(str,x,y);ctx.fillStyle=fill;ctx.fillText(str,x,y);
}
function drawSpr(img,x,y,size,flip,sy){
  sy=sy||1;const h=size*sy,top=y+size/2-h;
  if(flip){ctx.save();ctx.translate(x,0);ctx.scale(-1,1);ctx.drawImage(img,-size/2,top,size,h);ctx.restore();}
  else ctx.drawImage(img,x-size/2,top,size,h);
}
function club(x,y,ang,sc){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(sc,sc);
  ctx.fillStyle='#000';ctx.fillRect(-19,-4,16,8);ctx.fillRect(-5,-8,24,16);
  ctx.fillStyle='#b9822a';ctx.fillRect(-17,-2,14,4);ctx.fillStyle='#ffd84a';ctx.fillRect(-3,-6,20,12);
  ctx.fillStyle='#fff3a6';ctx.fillRect(-3,-6,20,3);ctx.fillStyle='#b9822a';ctx.fillRect(3,-1,3,3);ctx.fillRect(10,-1,3,3);ctx.fillRect(1,3,3,3);
  ctx.restore();
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  const p=g.player,vw=W/(Z*ZM),vh=H/(Z*ZM);g.view.w=vw;g.view.h=vh;
  const cx=Math.min(Math.max(p.x-vw/2,0),Math.max(0,WORLD-vw)),cy=Math.min(Math.max(p.y-vh/2,0),Math.max(0,WORLD-vh));
  const T0=performance.now()/1000;
  const sa=Math.min(shake,.3)/.2*6,sh=shake>0?(Math.random()-.5)*sa:0,sv=shake>0?(Math.random()-.5)*sa:0;
  ctx.fillStyle='#0b0d1a';ctx.fillRect(0,0,W,H);
  const ZZ=Z*ZM*(1+punch);ctx.setTransform(dpr*ZZ,0,0,dpr*ZZ,(W/2-(cx+vw/2)*ZZ+sh)*dpr,(H/2-(cy+vh/2)*ZZ+sv)*dpr);
  ctx.drawImage(BG,0,0);
  for(const f of flies){const fx_=f.x+Math.sin(T0*.6+f.ph)*18,fy_=f.y+Math.cos(T0*.5+f.ph)*14;if(fx_<cx-10||fx_>cx+vw+10||fy_<cy-10||fy_>cy+vh+10)continue;
    const a=.5+.5*Math.sin(T0*2+f.ph);ctx.fillStyle='rgba(200,255,120,'+(.18*a)+')';ctx.beginPath();ctx.arc(fx_,fy_,6,0,7);ctx.fill();ctx.fillStyle='rgba(235,255,170,'+(.4+.6*a)+')';ctx.fillRect(fx_-1,fy_-1,2,2);}
  {const gr=ctx.createRadialGradient(p.x,p.y,4,p.x,p.y,140);gr.addColorStop(0,'rgba(255,200,120,.22)');gr.addColorStop(1,'rgba(255,200,120,0)');ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(p.x-140,p.y-140,280,280);ctx.globalCompositeOperation='source-over';}
  ctx.strokeStyle='#e8472c';ctx.lineWidth=6;ctx.strokeRect(0,0,WORLD,WORLD);
  const vis=(x,y,m)=>x>cx-m&&x<cx+vw+m&&y>cy-m&&y<cy+vh+m;
  const T=g.time;

  // 경험치 / 엽전 / 떡
  for(const m of g.gems){if(!vis(m.x,m.y,10))continue;const b=Math.sin(T*6+m.id)*1.5;ctx.fillStyle='rgba(80,170,255,.22)';ctx.beginPath();ctx.arc(m.x,m.y+b-1,12,0,7);ctx.fill();
    ctx.fillStyle='#000';ctx.fillRect(m.x-5,m.y-8+b,10,14);ctx.fillStyle='#2f8cff';ctx.fillRect(m.x-4,m.y-7+b,8,12);ctx.fillStyle='#8fd0ff';ctx.fillRect(m.x-2,m.y-6+b,3,6);}
  for(const k of g.pickups){if(!vis(k.x,k.y,12))continue;
    if(k.type==='coin'){ctx.fillStyle='#000';ctx.fillRect(k.x-6,k.y-6,12,12);ctx.fillStyle='#ffc933';ctx.fillRect(k.x-5,k.y-5,10,10);ctx.fillStyle='#8a5a0a';ctx.fillRect(k.x-2,k.y-2,4,4);ctx.fillStyle='#fff3a6';ctx.fillRect(k.x-4,k.y-4,3,2);}
    else{ctx.fillStyle='#000';ctx.fillRect(k.x-11,k.y-4,22,12);ctx.fillStyle='#f3efe6';ctx.fillRect(k.x-10,k.y+3,20,3);ctx.fillStyle='#ff9ab8';ctx.fillRect(k.x-9,k.y-3,6,6);ctx.fillStyle='#fff';ctx.fillRect(k.x-3,k.y-3,6,6);ctx.fillStyle='#7ccf6a';ctx.fillRect(k.x+3,k.y-3,6,6);}}

  // 도깨비불 폭발 (가산 혼합으로 번쩍이게)
  ctx.globalCompositeOperation='lighter';
  for(const b of g.bursts){const k=1-b.life/b.maxLife,r=b.r*(1-(1-k)*(1-k));
    ctx.globalAlpha=(1-k)*.5;ctx.fillStyle='#ff6a10';ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();
    ctx.globalAlpha=(1-k)*.6;ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.arc(b.x,b.y,r*.6,0,7);ctx.fill();
    ctx.globalAlpha=1-k;ctx.strokeStyle='#ffe066';ctx.lineWidth=5;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.stroke();
    for(let i=0;i<24;i++){const a=i/24*6.283+k*2;ctx.fillStyle=i%2?'#ff5a1a':'#ffd23a';const q=10-8*k;ctx.fillRect(b.x+Math.cos(a)*r-q/2,b.y+Math.sin(a)*r-q/2,q,q);}
    ctx.globalAlpha=1;}
  ctx.globalCompositeOperation='source-over';

  // 적 (아래쪽부터 그려 겹침 자연스럽게)
  const en=g.enemies.filter(e=>vis(e.x,e.y,50)).sort((a,b)=>a.y-b.y);
  for(const e of en){
    const sz=SIZE[e.kind]*(e.elite?1.3:1);let bob=0,sy=1,sw=1,al=1;
    if(e.elite){const ga=.3+.12*Math.sin(T*8+e.id),gr=ctx.createRadialGradient(e.x,e.y,4,e.x,e.y,sz*.9);gr.addColorStop(0,'rgba(255,60,40,'+ga+')');gr.addColorStop(1,'rgba(255,60,40,0)');ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(e.x-sz,e.y-sz,sz*2,sz*2);ctx.globalCompositeOperation='source-over';}
    if(e.kind==='grunt'){bob=Math.sin(T*3+e.id)*3-3;al=.93;sy=1+Math.sin(T*6+e.id)*.04;}
    else if(e.kind==='fast'){bob=Math.sin(T*14+e.id)*1.5;sy=1+Math.sin(T*14+e.id)*.07;}
    else if(e.kind==='tank'){const h=Math.abs(Math.sin(T*5+e.id));bob=-h*7;sw=1-h*.25;sy=1+(1-h)*-.05;}
    else if(e.kind==='tiger'){bob=Math.sin(T*8+e.id)*1.2;if(e.st===2){sy=.86;if(Math.random()<.6)P(e.x,e.y+8,(Math.random()-.5)*30,0,.3,'rgba(255,200,120,.7)',4,0);}else if(e.st===1){bob=Math.sin(T*50)*2;sy=.92;}}

    else if(e.kind==='mini'){bob=-Math.abs(Math.sin(T*12+e.id))*4;}

    else{bob=Math.sin(T*2)*2;}

    if(e.flash>0)sy*=.9;
    if(e.kind==='boss'){const gr=ctx.createRadialGradient(e.x,e.y,8,e.x,e.y,80);gr.addColorStop(0,'rgba(220,40,40,.35)');gr.addColorStop(1,'rgba(220,40,40,0)');ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(e.x-80,e.y-80,160,160);ctx.globalCompositeOperation='source-over';}
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(e.x,e.y+sz*.4,sz*.32*sw,sz*.1,0,0,7);ctx.fill();
    ctx.globalAlpha=al;
    drawSpr(S[SPR[e.kind]+(e.flash>0?'F':'')],e.x,e.y+bob-(e.kind==='boss'?4:0),sz,p.x<e.x,sy);
    ctx.globalAlpha=1;
    if(e.elite){const w=sz*.8;ctx.fillStyle='#000';ctx.fillRect(e.x-w/2-1,e.y-sz/2-10,w+2,6);ctx.fillStyle='#ff4a2a';ctx.fillRect(e.x-w/2,e.y-sz/2-9,w*Math.max(0,e.hp/e.maxHp),4);}
    if(e.kind==='tiger'&&e.st===1){ctx.strokeStyle='rgba(255,60,60,.4)';ctx.lineWidth=4;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.vx*190,e.y+e.vy*190);ctx.stroke();ctx.setLineDash([]);outline('!',e.x,e.y-sz/2-8,24,'#ff3b3b','center');}
    if(e.kind==='boss'){const w=80;ctx.fillStyle='#000';ctx.fillRect(e.x-w/2-1,e.y-sz/2-14,w+2,8);ctx.fillStyle='#d62828';ctx.fillRect(e.x-w/2,e.y-sz/2-13,w*Math.max(0,e.hp/e.maxHp),6);}
  }

  // 방망이 링
  const nb=g.stats.blades;
  if(nb){
    ctx.fillStyle='rgba(255,200,80,.10)';ctx.beginPath();ctx.arc(p.x,p.y,72,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,226,140,.65)';ctx.lineWidth=7;ctx.setLineDash([10,7]);ctx.beginPath();ctx.arc(p.x,p.y,72,0,7);ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<nb;i++){const a=g.orbitAngle+i*6.2832/nb;club(p.x+Math.cos(a)*72,p.y+Math.sin(a)*72,a+Math.PI/2+.5,1);}
  }

  // 도깨비
  const moving=Math.hypot(mv.x,mv.y)>.05||keys.size>0;
  if(Math.abs(mv.x)>.1)face=mv.x>0?1:-1;else if(keys.has('a')||keys.has('arrowleft'))face=-1;else if(keys.has('d')||keys.has('arrowright'))face=1;
  const hb=moving?Math.sin(T*16)*2:Math.sin(T*4)*.8;
  if(g.combo>=10){const ac=g.combo>=100?'hsla('+((T*200)%360|0)+',100%,60%,':g.combo>=50?'rgba(255,120,200,':g.combo>=25?'rgba(255,230,120,':'rgba(255,150,60,';
    const gr=ctx.createRadialGradient(p.x,p.y,6,p.x,p.y,58);gr.addColorStop(0,ac+(.4+.12*Math.sin(T*10))+')');gr.addColorStop(1,ac+'0)');
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(p.x-58,p.y-58,116,116);ctx.globalCompositeOperation='source-over';}
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(p.x,p.y+16,12,4,0,0,7);ctx.fill();
  ctx.globalAlpha=g.iframe>0&&Math.floor(T*20)%2?.45:1;
  drawSpr(S[moving?WALK[(T*10|0)%4]:'hero'],p.x,p.y+hb,38*(1+recoil*.2),face<0,1-recoil*.12);
  ctx.globalAlpha=1;
  const hw=34;ctx.fillStyle='#000';ctx.fillRect(p.x-hw/2-1,p.y+22,hw+2,7);ctx.fillStyle='#5a1414';ctx.fillRect(p.x-hw/2,p.y+23,hw,5);ctx.fillStyle='#46d14a';ctx.fillRect(p.x-hw/2,p.y+23,hw*p.hp/p.maxHp,5);

  // 참격(총알)
  for(const b of g.bullets){if(!vis(b.x,b.y,20))continue;const a=Math.atan2(b.vy,b.vx);ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(90,180,255,.22)';ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';if(Math.random()<.35)P(b.x,b.y,0,0,.22,'rgba(140,210,255,.8)',3,0);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
    ctx.fillStyle='rgba(80,180,255,.45)';ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(0,-6);ctx.lineTo(10,0);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#bfe6ff';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(0,-3.5);ctx.lineTo(9,0);ctx.lineTo(0,3.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-4,-1,10,2);ctx.restore();}

  // 적 불화살
  ctx.globalCompositeOperation='lighter';
  for(const sh of g.shots){if(!vis(sh.x,sh.y,12))continue;ctx.fillStyle='rgba(255,90,40,.3)';ctx.beginPath();ctx.arc(sh.x,sh.y,12,0,7);ctx.fill();if(Math.random()<.5)P(sh.x,sh.y,0,0,.25,'rgba(255,140,60,.8)',3,0);}
  ctx.globalCompositeOperation='source-over';
  for(const sh of g.shots){if(!vis(sh.x,sh.y,12))continue;ctx.fillStyle='#ff4a2a';ctx.beginPath();ctx.arc(sh.x,sh.y,6,0,7);ctx.fill();ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(sh.x,sh.y,2.5,0,7);ctx.fill();}
  // 필살기 빛
  if(specialT>0){const k=1-specialT/.6,rr=80+700*k,gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);gr.addColorStop(0,'rgba(255,240,170,'+.6*(1-k)+')');gr.addColorStop(.7,'rgba(255,180,70,'+.25*(1-k)+')');gr.addColorStop(1,'rgba(255,160,60,0)');
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=gr;ctx.fillRect(p.x-rr,p.y-rr,rr*2,rr*2);ctx.globalCompositeOperation='source-over';}
  // 충격파 링
  ctx.globalCompositeOperation='lighter';
  for(const r of rings){const k=1-r.t/r.life,rad=r.max*(1-(1-k)*(1-k));ctx.globalAlpha=(1-k)*.9;ctx.strokeStyle='rgb('+r.c+')';ctx.lineWidth=r.w*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,7);ctx.stroke();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // 번개
  for(const th of g.thunders){const k=th.life/.3;ctx.globalAlpha=k;
    ctx.fillStyle='rgba(150,210,255,.45)';ctx.beginPath();ctx.arc(th.x,th.y,46*(1.2-k*.4),0,7);ctx.fill();
    const pts=[[th.x+Math.sin(th.x)*10,th.y-vh/2-40]];for(let i=1;i<8;i++)pts.push([th.x+Math.sin(th.x*.7+i*12.9+(th.life*40|0))*16,th.y-(vh/2+40)*(1-i/8)]);pts.push([th.x,th.y]);
    for(const [w,c] of [[9,'rgba(90,170,255,.6)'],[3,'#fff']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();}
    ctx.globalAlpha=1;}
  // 파티클
  for(const q of parts){if(!vis(q.x,q.y,10))continue;ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
  ctx.globalAlpha=1;
  // 데미지 숫자 (0 일반 / 1 불꽃 / 2 번개 / 3 치명타)

  for(const f of g.floaters){ctx.globalAlpha=Math.min(1,f.life*3);{const kk=.6-f.life,pop=1+Math.max(0,.15-kk)*(f.kind===3?9:4);outline('-'+f.text+(f.kind===3?'!':''),f.x,f.y,(f.kind===3?19:f.kind?15:13)*pop,FC[f.kind]||'#fff','center');}}
  ctx.globalAlpha=1;

  /* ----- 화면 좌표 ----- */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(g.hurt>0){ctx.fillStyle='rgba(220,30,30,'+(g.hurt/.2*.25)+')';ctx.fillRect(0,0,W,H);}
  if(phase==='playing'&&p.hp/p.maxHp<.3){const a=.1+.08*Math.sin(T*8);const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)*.55);gr.addColorStop(0,'rgba(200,0,0,0)');gr.addColorStop(1,'rgba(200,0,0,'+(a*3)+')');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  if(flash>0){ctx.fillStyle='rgba(255,240,180,'+flash*.35+')';ctx.fillRect(0,0,W,H);}

  if(stick&&phase==='playing'){
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(stick.ox,stick.oy,50,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(stick.ox+stick.dx,stick.oy+stick.dy,22,0,7);ctx.fill();
  }

  // HUD: 상단 경험치 바 + LV

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,bh+4);ctx.fillStyle='#161a3a';ctx.fillRect(3,3,W-6,bh-2);
  const xw=(W-6)*Math.min(1,p.xp/p.xpNext);
  ctx.fillStyle='#2f6fe0';ctx.fillRect(3,3,xw,bh-2);ctx.fillStyle='#6fb2ff';ctx.fillRect(3,3,xw,(bh-2)/3);
  if(xw>8){const x0=3+((T*160)%xw),w=Math.min(26,3+xw-x0);ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(x0,3,w,bh-2);}
  outline('LV '+p.level,10,bh/2+2,13*hs,'#fff');
  // 스킬 아이콘
  const icons=[{t:'b',l:g.stats.bullets}];if(g.stats.blades)icons.push({t:'c',l:g.stats.blades});if(g.upgrades.fire)icons.push({t:'f',l:g.upgrades.fire});if(g.upgrades.thunder)icons.push({t:'t',l:g.upgrades.thunder});
  icons.forEach((ic,i)=>{const ix=8+i*(34*hs),iy=bh+10,sz=30*hs;
    ctx.fillStyle='#000';ctx.fillRect(ix-2,iy-2,sz+4,sz+4);ctx.fillStyle='#2a2f5e';ctx.fillRect(ix,iy,sz,sz);
    if(ic.t==='c')club(ix+sz/2,iy+sz/2,-.7,.55*hs);
    else if(ic.t==='f'||ic.t==='t'){ctx.font=(18*hs)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ic.t==='f'?'🔥':'⚡',ix+sz/2,iy+sz/2+1);}
    else{ctx.save();ctx.translate(ix+sz/2,iy+sz/2);ctx.rotate(-.6);ctx.fillStyle='#8fd0ff';ctx.fillRect(-9*hs,-2*hs,18*hs,4*hs);ctx.fillStyle='#fff';ctx.fillRect(-3*hs,-1*hs,10*hs,2*hs);ctx.restore();}
    outline(String(ic.l),ix+sz-2,iy+sz-4,11*hs,'#ffd84a','right');});
  // 타이머 / 엽전 / 처치
  outline(fmt(g.time),W/2,bh+22*hs,26*hs,'#fff','center');
  if(phase==='playing')outline(DIFFICULTIES[g.diff].name,W/2,bh+46*hs,12*hs,DC[g.diff],'center');
  outline('●',W-96*hs,bh+20*hs,14*hs,'#ffc933','center');outline(String(g.coins),W-84*hs,bh+20*hs,16*hs,'#ffe38a','left');
  outline('☠',W-96*hs,bh+44*hs,14*hs,'#e6e6e6','center');outline(String(g.kills),W-84*hs,bh+44*hs,16*hs,'#fff','left');
  if(toast){const k=Math.min(1,toast.t/.4),pop=1+Math.max(0,toast.t-(toast===null?0:toast.t))*0;ctx.globalAlpha=k;outline(toast.text,W/2,H*.27,Math.min(34,W/14)*Math.max(1,hs*.8),toast.c,'center');ctx.globalAlpha=1;}
  // 콤보
  if(g.combo>=5){
    if(g.combo!==lastCombo){popT=.15;lastCombo=g.combo;}
    const pop=1+popT*3,cxp=W-14*hs,cyp=H*.4;
    ctx.save();ctx.translate(cxp,cyp);ctx.scale(pop,pop);
    const cc=g.combo>=100?'hsl('+((T*240)%360|0)+',100%,62%)':g.combo>=50?'#ff7ad9':g.combo>=25?'#fff07a':'#ffb02e';
    if(g.combo>=50)ctx.translate((Math.random()-.5)*3,(Math.random()-.5)*3);
    outline('x'+g.combo,0,0,34*hs,cc,'right');outline('COMBO!',0,28*hs,18*hs,'#ff4a3a','right');ctx.restore();
  }else lastCombo=0;
  if(popT>0)popT-=1/60;
  if(AD&&(phase==='ad'||phase==='adwait'))adDraw();
}


/* ---------- 광고(트레일러): 실제 게임 엔진을 연출대로 돌린다 (약 30초) ---------- */
function cap(text,dur,c,y,size){caps.push({text,t0:adT,dur:dur||2,c:c||'#fff',y:y||.78,size:size||1});}
function up(id,n){for(let i=0;i<n;i++)applyUpgrade(g,id);}
const AD_TL=[
  [0.3,()=>cap('고요한 밤…',2.2,'#cfd8ff',.5)],
  [2.6,()=>cap('그런데…',1.0,'#ff9a9a',.5)],
  [3.0,()=>{Au.play();Au.setIntensity(0);g.hordeAt=g.time;}],
  [3.6,()=>{adTitle=adT;flash=1;shake=.6;zk=.3;Au.sfx('boss');ring(g.player.x,g.player.y,420,.8,'255,60,60',10);Au.setIntensity(1);}],
  [6.8,()=>{cap('도깨비가 나선다!',2.2,'#8fd0ff');up('multi',1);up('blade',2);Au.setIntensity(2);}],
  [9.0,()=>{cap('쏘고 · 베고 · 태우고!',2.2,'#ffb02e');up('fire',3);up('pierce',1);up('damage',1);}],
  [11.4,()=>{cap('번개까지 내리친다  ⚡',2,'#bfe6ff');up('thunder',3);up('damage',2);zk=.2;}],
  [13.6,()=>{cap('끝없이 터지는 콤보!',2,'#ff7ad9');up('rate',2);up('blade',2);up('multi',1);}],
  [15.8,()=>{cap('새로운 괴물들이 몰려온다!',1.6,'#ffd84a');g.time=70;g.bossesSpawned=1;g.spawnT=0;Au.setIntensity(3);}],
  [17.6,()=>{cap('🐯 호랑이   🥚 달걀귀신   💀 해골 궁수',2.4,'#fff',.8,.8);}],
  [20.0,()=>{cap('⚠ 저승사자 출현!',2.2,'#ff4a3a');g.time=60.1;g.bossesSpawned=0;zk=.25;}],
  [23.0,()=>{cap('필살기 충전 완료!',1.3,'#8fd0ff');g.charges=1;Au.sfx('ready');}],
  [24.3,()=>{cap('SPACE · 도깨비 대폭발!!',2.0,'#ffd84a',.5,1.15);useSpecial(g);}],
  [26.6,()=>showCTA()],
];
let sd=12345;const REAL_RAND=Math.random;
function adWait(){
  phase='adwait';syncBtns();ov.classList.add('solid');
  show('<div class="t1">탕탕 특공대</div><h1>귀신 천마리</h1><button class="btn" id="go">▶ 광고 재생</button><p>소리를 켜고 보세요 🔊</p>');
  document.getElementById('go').onclick=startAd;
}
function startAd(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  Au.init();Au.resume();Au.stop();
  sd=12345;Math.random=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;}; // 매번 같은 연출
  g=createGame();parts.length=0;rings.length=0;caps.length=0;toast=null;flash=0;shake=0;hitStop=0;slow=0;punch=0;
  adT=0;adI=0;adAcc=0;zk=0;adTitle=-9;ZM=1.3;phase='ad';hide();syncBtns();
}
function showCTA(){
  Au.setIntensity(2);
  show('<div class="t1">탕탕 특공대</div><h1>귀신 천마리</h1><p>도깨비가 되어 천 마리 귀신을 막아내라!\n무료 · 설치 없이 바로 플레이</p><button class="btn" id="go">지금 플레이 ▶</button><button class="small" id="rp">↻ 광고 다시 보기</button>');
  document.getElementById('go').onclick=()=>{if(GAME_URL){location.href=GAME_URL;return;}Math.random=REAL_RAND;start();};
  document.getElementById('rp').onclick=startAd;
}
function adStep(dt){
  adT+=dt;
  while(adI<AD_TL.length&&AD_TL[adI][0]<=adT){AD_TL[adI][1]();adI++;}
  let sdt=dt;if(hitStop>0){hitStop-=dt;sdt=0;}else if(slow>0){slow-=dt;sdt=dt*.3;}
  if(sdt>0)step(g,sdt,Math.cos(adT*.9),Math.sin(adT*.7));
  g.player.hp=g.player.maxHp;g.pendingLevel=0;toast=null; // 광고에서는 무적, 레벨업 창 없음
  handleEvents(adT>.2);updateParts(dt);
  if(g.hurt>.15)shake=Math.max(shake,.2);else shake=Math.max(0,shake-dt);
  zk*=Math.pow(.05,dt);ZM=1+zk+Math.max(0,(4-adT)/4)*.3;
}
function dimA(){
  if(adT<2.4)return .8-.35*adT/2.4;
  if(adT<3.6)return .45;
  if(adT<4.3)return .45*(1-(adT-3.6)/.7);
  if(adT>25.8)return Math.min(.6,(adT-25.8)*.8);
  return 0;
}
function adDraw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const da=phase==='adwait'?1:dimA();
  if(da>0){ctx.fillStyle='rgba(2,3,12,'+da+')';ctx.fillRect(0,0,W,H);}
  if(phase!=='ad')return;
  // 타이틀 슬램
  const a=adT-3.6;
  if(a>=0&&a<3.3){
    const out=Math.min(1,(3.3-a)/.5),sc=a<.18?3-(a/.18)*2:1+.02*Math.sin(a*5),u=Math.min(W,H*1.6);
    ctx.save();ctx.translate(W/2,H*.42);ctx.globalAlpha=Math.min(1,a/.08)*out;
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.rotate(adT*.4);
    for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.fillStyle='rgba(255,90,60,.12)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,-40);ctx.lineTo(W,40);ctx.fill();}
    ctx.restore();
    ctx.scale(sc,sc);
    outline('탕탕 특공대',0,-u/9,u/20,'#9fb4ff','center');
    outline('귀신 천마리',0,0,u/6.5,'#ff3b3b','center');
    outline('도깨비 vs 귀신 1,000마리',0,u/10,u/24,'#fff','center');
    ctx.restore();
  }
  for(const c of caps){
    const age=adT-c.t0;if(age<0||age>c.dur)continue;
    const k=Math.min(1,age/.22),o=Math.min(1,(c.dur-age)/.3);
    ctx.save();ctx.globalAlpha=Math.min(k,o);ctx.translate(W/2,H*c.y);const sc=1+(1-k)*.6;ctx.scale(sc,sc);
    outline(c.text,0,0,Math.min(54,W/13)*c.size,c.c,'center');ctx.restore();
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(phase==='ready'){
    // 타이틀 배경 데모: 도깨비가 자동으로 싸운다 (소리 없음)
    g.player.hp=g.player.maxHp;const a=now/1500;step(g,dt,Math.cos(a),Math.sin(a*.8));
    while(g.pendingLevel>0)applyUpgrade(g,pickUpgrades(g)[0].id);
    handleEvents(false);updateParts(dt);if(g.time>100)g=createGame();
  }else if(phase==='playing'&&!choosing&&!paused){
    let mx=mv.x,my=mv.y;
    if(keys.size){mx+=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);my+=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);}
    let sdt=dt;if(hitStop>0){hitStop-=dt;sdt=0;}else if(slow>0){slow-=dt;sdt=dt*.3;}
    if(sdt>0)step(g,sdt,mx,my);
    const MS=[10,25,50,100,150,200,300,500];
    while(milestone<MS.length&&g.combo>=MS[milestone]){toast={text:MS[milestone]+' COMBO!',c:'#ffb02e',t:1.4};Au.sfx('combo');ring(g.player.x,g.player.y,170,.6,'255,200,80',6);flash=Math.max(flash,.25);punch=Math.max(punch,.05);milestone++;}
    if(g.combo===0)milestone=0;
    if((dustT-=dt)<=0&&Math.hypot(mx,my)>.1){dustT=.09;P(g.player.x+(Math.random()-.5)*8,g.player.y+16,(Math.random()-.5)*20,-10,.35,'#7a6552',3,0);}
    handleEvents(true);updateParts(dt);
    if(g.hurt>.15)shake=Math.max(shake,.2);else shake=Math.max(0,shake-dt);
    Au.setIntensity(Math.min(3,1+Math.floor(g.time/40)+(g.enemies.some(e=>e.kind==='boss')?1:0)));
    if(g.over)gameOver();else if(g.pendingLevel>0)levelUp();
  }else if(phase==='ad'){
    adAcc+=Math.min(dt,.1);while(adAcc>=1/60){adAcc-=1/60;adStep(1/60);}
  }else if(phase==='over'){updateParts(dt);shake=Math.max(0,shake-dt);}
  updSpecialUI();draw();requestAnimationFrame(loop);
}
if(AD)adWait();else menu();requestAnimationFrame(loop);
window.__game=()=>g;
})();
</script>
